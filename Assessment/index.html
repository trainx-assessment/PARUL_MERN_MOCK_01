<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="nav">
            <h1>Student Application Management System</h1>
        </nav>
        <p>*Registers and Saves Student Details*</p>
    </header>
    <form id="studentForm">

    <fieldset>
        <legend><b>Personal Information</b></legend>

        <label for="name">Name :</label>
        <input
            type="text"
            id="name"
            placeholder="Mary Jane"
            style="border: none;"
        >
        <br><br>

        <label for="email">Email :</label>
        <input
            type="email"
            id="email"
            placeholder="abc@example.com"
            style="border: none;"
        >
        <br><br>

        <label for="ph_no">Mobile no :</label>
        <input
            type="tel"
            id="ph_no"
            maxlength="10"
            placeholder="9876543210"
            style="border: none;"
        >
        <br><br>

        <label for="dob">Date of Birth :</label>
        <input type="date" id="dob" style="border: none;">
        <br><br>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Gender Information</b></legend>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Course</b></legend>

        <label for="c">Courses :</label>

        <select id="c">
            <option value="" disabled selected>-- Select Course --</option>
            <option value="Web Development">Web Development</option>
            <option value="UI/UX">UI/UX</option>
            <option value="Python">Python</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="MERN Stack">MERN Stack</option>
            <option value="Cloud Computing">Cloud Computing</option>
        </select>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Skills</b></legend>

        <input type="checkbox" id="html" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" value="JavaScript">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="git" value="Git">
        <label for="git">Git</label>

        <input type="checkbox" id="react" value="React">
        <label for="react">React</label>

        <input type="checkbox" id="node" value="Node.js">
        <label for="node">Node.js</label>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Additional Information</b></legend>

        <label for="about">About the Student :</label>

        <textarea
            id="about"
            maxlength="200"
            placeholder="Max. 200 characters"
        ></textarea>

        <div id="charCount">0 / 200</div>

        <br>

        <label for="file">Upload Profile Photo :</label>
        <input
            type="file"
            id="file"
            accept="image/*"
        >
    </fieldset>

    <br>

    <input type="checkbox" id="agree">
    <label for="agree">Agree & Continue</label>

    <br><br>

    <button type="submit" id="submitbtn">Register Student</button>
    <button type="reset" id="resetbtn">Reset Form</button>

</form>

<br>

<div class="statistics"></div>

<div class="searchFilter"></div>

<div id="studentContainer"></div>

    <script src="script.js"></script>
</body>
</html>
