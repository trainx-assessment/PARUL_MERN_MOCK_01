<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>

        <section class="registration-section">
            <h2>Student Registration Form</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Skills</legend>

                    <label>
                        <input type="checkbox" name="skills" value="HTML">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="CSS">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="JavaScript">
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Git">
                        Git
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="React">
                        React
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Node.js">
                        Node.js
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="about">About Student</label>
                    <textarea
                        id="about"
                        name="about"
                        maxlength="200"
                        placeholder="Maximum 200 characters"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="profilePhoto">Profile Photo</label>
                    <input
                        type="file"
                        id="profilePhoto"
                        name="profilePhoto"
                        accept="image/*"
                    >
                </div>

                <div class="buttons">
                    <button type="submit">Register Student</button>
                    <button type="reset">Reset Form</button>
                </div>

            </form>
        </section>

        <section class="statistics-section">
            <h2>Student Statistics</h2>

            <div class="statistics">

                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div class="stat-card">
                    <h3>Applications</h3>
                    <p id="totalApplications">0</p>
                </div>

            </div>
        </section>

        <section class="search-section">
            <h2>Search and Filter</h2>

            <input
                type="text"
                id="search"
                placeholder="Search students..."
            >

            <select id="filter">
                <option value="all">All Students</option>
                <option value="name">By Name</option>
                <option value="course">By Course</option>
            </select>
        </section>

        <section class="students-section">
            <h2>Student Applications</h2>

            <div id="studentContainer"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
