<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications : </p>
    </header>

    <div class="container">
        <h2>Student Registration Form</h2>

        <form id="studentForm">

            <label>Student Name : *</label>
            <input type="text" id="name" placeholder="Enter Your Name" required>

            <label>Email : *</label>
            <input type="email" id="email" placeholder="abc@gmail.com">

            <label>Phone Number : *</label>
            <input type="text" id="phone" placeholder="Enter your phone Number" required>

            <label>Date of Birth : *</label>
            <input type="date" id="dob" required>

            <label>Gender</label>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other

            <br><br>

            <label>Course</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>

            <label>Skills</label>

            <input type="checkbox" name="skills" value="HTML"> HTML
            <input type="checkbox" name="skills" value="CSS"> CSS
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
            <input type="checkbox" name="skills" value="React"> React

            <br><br>

            <label>About Student</label>
            <textarea id="about" maxlength="200" required></textarea>

            <label>Profile Photo</label>
            <input type="file" id="photo" accept="image/*" required>

            <br><br>

            <button type="submit">Register Student</button>
            <button type="button" id="resetBtn">Reset</button>

        </form>
    </div>


    <div class="container">

        <h2>Search Students</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by name"
        >

        <select id="filter">
            <option value="All">All Courses</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
        </select>

    </div>


    <div class="container">

        <h2>Student Statistics</h2>

        <p>Total Students: <span id="total">0</span></p>

    </div>


    <div class="container">

        <h2>Student Applications</h2>

        <div id="students"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
