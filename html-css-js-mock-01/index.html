<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>

        <section>
            <h2>Student Registration Form</h2>

            <form id="studentForm">

                <div class="grid">

                    <div>
                        <label>Student Name</label>
                        <input type="text" id="name">
                        <small class="error"></small>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email">
                        <small class="error"></small>
                    </div>

                    <div>
                        <label>Phone Number</label>
                        <input type="text" id="phone">
                        <small class="error"></small>
                    </div>

                    <div>
                        <label>Date of Birth</label>
                        <input type="date" id="dob">
                        <small class="error"></small>
                    </div>

                    <div>
                        <label>Gender</label>

                        <div class="choices">
                            <label>
                                <input type="radio" name="gender" value="Male">
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender" value="Female">
                                Female
                            </label>

                            <label>
                                <input type="radio" name="gender" value="Other">
                                Other
                            </label>
                        </div>

                        <small class="error"></small>
                    </div>

                    <div>
                        <label>Course</label>

                        <select id="course">
                            <option value="">Select Course</option>
                            <option>Web Development</option>
                            <option>UI/UX</option>
                            <option>Python</option>
                            <option>Data Analytics</option>
                            <option>MERN Stack</option>
                            <option>Cloud Computing</option>
                        </select>

                        <small class="error"></small>
                    </div>

                    <div class="full">
                        <label>Skills</label>

                        <div class="choices">
                            <label>
                                <input type="checkbox" name="skills" value="HTML">
                                HTML
                            </label>

                            <label>
                                <input type="checkbox" name="skills" value="CSS">
                                CSS
                            </label>

                            <label>
                                <input type="checkbox" name="skills" value="JavaScript">
                                JavaScript
                            </label>

                            <label>
                                <input type="checkbox" name="skills" value="Git">
                                Git
                            </label>

                            <label>
                                <input type="checkbox" name="skills" value="React">
                                React
                            </label>

                            <label>
                                <input type="checkbox" name="skills" value="Node.js">
                                Node.js
                            </label>
                        </div>

                        <small class="error"></small>
                    </div>

                    <div class="full">
                        <label>About Student</label>

                        <textarea id="about" maxlength="200"></textarea>

                        <span id="counter">0 / 200</span>
                        <small class="error"></small>
                    </div>

                    <div class="full">
                        <label>Profile Photo</label>

                        <input type="file" id="photo" accept="image/*">
                        <small class="error"></small>
                    </div>

                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">
                        Register Student
                    </button>

                    <button type="reset" class="secondary">
                        Reset
                    </button>
                </div>

            </form>
        </section>



        <section>
            <h2>Student Statistics</h2>
            <div id="stats" class="stats"></div>
        </section>



        <section>
            <h2>Search and Filter</h2>

            <div class="toolbar">
                <input type="text" id="search" placeholder="Search student by name">

                <select id="filter">
                    <option value="All Courses">All Courses</option>
                    <option>Web Development</option>
                    <option>UI/UX</option>
                    <option>Python</option>
                    <option>Data Analytics</option>
                    <option>MERN Stack</option>
                    <option>Cloud Computing</option>
                </select>
            </div>
        </section>

        <section>
            <h2>Students</h2>
            <div id="cards" class="cards"></div>
        </section>

    </main>


    <footer>
        Register and manage applications
    </footer>


    <script src="script.js"></script>

</body>

</html>
