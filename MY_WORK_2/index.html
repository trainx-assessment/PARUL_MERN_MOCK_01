<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">


    </head>
    <body>
        <header>
        <h1>Student Registration Form</h1>
        <
    </header>
<main>
            <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        required
                </div>

                    <div class="form-group">
                    <label for="studentEmail">Email</label>
                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter email"
                        required
                    >
                </div>
                    <div class="form-group">
                    <label for="studentPhoneNo">PhoneNo</label>
                    <input
                        type="tel"
                        id="studentPhone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="studentDateOfBirth">DateOfBirth</label>
                    <input
                        type="date"
                        id="studentDateOfBirth"
                        placeholder="Enter date of birth"
                        required

                    <div class="form-group">
                    <label for="studentCourse">Course</label>

                    <select id="studentCourse" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="Mern Stack"> Mern Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentGender">Gender</label>

                    <select id="studentGender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Others">Others</option>
                        
                    </select>
                </div>

                 <div class="form-group">
                    <label for="studentSkill">Gender</label>

                    <select id="studentSkill" required>
                        <option value="Html">Html</option>
                        <option value="Css">Css</option>
                        <option value="Git">Git</option>
                        <option value="Javascript">Javascript</option>
                        <option value="React">React</option>
                        <option value="Node.js">Node.js</option>
                        
                    </select>
                </div>
                </div>
                    <div class="form-group">
                    <label for="AboutStudent">AboutStudent</label>
                    <input
                        type="text"
                        id="AboutStudent"
                        placeholder="Enter Student About"
                        required
                    >
                </div>
                <button type="Register Student" id="submitButton">Register Student
                    
                </button>
                <button type="Student Form" id="submitButton">Student Form
                    
                </button>




             

            </form>

        </section>


        

    </body>
</html>
