<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <h2>Register and manage student applications</h2>
    </header>
    <form>
        <label for="Name">Student Name : <input type="text"></label>

        <label for="email">Email : <input type="email"></label>
        <label for="Phone Number">Phone Number : <input type="text"></label>
        <label for="BOD">Date of Birth : <input type="date"></label>
        <label for="gender">Gender :
            <label for=""> Male <input type="radio"></label>
        <label for=""> Female <input type="radio"> </label>
        <label for=""> Other <input type="radio"> </label>
    </label>
        <label for="course">Select Course:
        <select>
            <option value="">Web Devlopmennt</option>
            <option value="">UI/UX</option>
            <option value="">Python</option>
            <option value="">Data Analytics</option>
            <option value="">MERN Stack</option>
            <option value="">Cloud Computing</option>
        </select>
        </label>
        <label for="Skills">Skills :
        <label for=""> HTML <input type="checkbox"></label>
        <label for=""> CSS <input type="checkbox"></label>
        <label for=""> JavaScript <input type="checkbox"></label>
        <label for=""> Git <input type="checkbox"></label>
        <label for=""> React <input type="checkbox"></label>
        <label for=""> Node js <input type="checkbox"></label>
        </label>
        <br>
        <label for="about student">About Student: <input type="textarea" aria-rowcount="5"  maxlength="200"> </label>
        <br>
        <label for="photo">Profile Photo <input type="file" name="Photo" accept="image"> </label>
        <br>
        <label for="">Register Student<button class="b1">Submit</button> </label>
        <label for="">Reset form<button class="b2">Click</button> </label>
 
    </form>
    <script src="script.js"></script>
</body>
</html>
