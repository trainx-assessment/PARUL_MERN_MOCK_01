<!DOCTYPE html>
<html>
<head>
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
</header>

<div class="container">

    <div class="box">
        <h2>Student Registration</h2>

        <form id="studentForm">

            <label>Student Name</label>
            <input type="text" id="name">

            <label>Email</label>
            <input type="email" id="email">

            <label>Phone Number</label>
            <input type="text" id="phone">

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <label>Gender</label>
            <div>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>

            <label>Skills</label>
            <div>
                <input type="checkbox" name="skill" value="HTML"> HTML
                <input type="checkbox" name="skill" value="CSS"> CSS
                <input type="checkbox" name="skill" value="JavaScript"> JavaScript
                <input type="checkbox" name="skill" value="Git"> Git
                <input type="checkbox" name="skill" value="React"> React
                <input type="checkbox" name="skill" value="Node.js"> Node.js
            </div>

            <label>About Student</label>
            <textarea id="about" maxlength="200"></textarea>
            <small id="count">0 / 200</small>

            <label>Profile Photo</label>
            <input type="file" id="photo" accept="image/*">

            <button type="submit">Register Student</button>
            <button type="reset">Reset Form</button>

        </form>
    </div>

    <div class="box">
        <h2>Student Statistics</h2>
        <p>Total Students: <span id="total">0</span></p>
    </div>

    <div class="box">
        <h2>Search and Filter</h2>

        <input type="text" id="search" placeholder="Search student by name...">

        <select id="filter">
            <option value="">All Courses</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
        </select>
    </div>

    <div class="box">
        <h2>Student Cards</h2>
        <div id="cards"></div>
    </div>

</div>

<footer>
    Student Application Management System
</footer>

<script src="script.js"></script>

</body>
</html>
