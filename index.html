<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>

    <h2>Student Registration</h2>

    <form id="registration">
      <div>
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter name" required />
      </div>

      <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>

      <div>
        <label>Phone Number</label>
        <input
          type="text"
          id="number"
          placeholder="Enter mobile number"
          required
        />
      </div>

      <div>
        <label>Date of Birth</label>
        <input type="date" id="dateofbirth" required />
      </div>

      <div>
        <label>Gender</label>
        <label><input type="radio" name="gender" value="Male" /> Male</label>
        <label
          ><input type="radio" name="gender" value="Female" /> Female</label
        >
        <label><input type="radio" name="gender" value="Other" /> Other</label>
      </div>

      <div>
        <label>Course</label>
        <select id="course">
          <option value="">Select Course</option>
          <option value="Web Development">Web Development</option>
          <option value="UI/UX">UI/UX</option>
          <option value="Python">Python</option>
          <option value="Data Analytics">Data Analytics</option>
          <option value="MERN Stack">MERN Stack</option>
          <option value="Cloud Computing">Cloud Computing</option>
        </select>
      </div>

      <div>
        <label>Skills</label>
        <label><input type="checkbox" name="skills" value="HTML" /> HTML</label>
        <label><input type="checkbox" name="skills" value="CSS" /> CSS</label>
        <label
          ><input type="checkbox" name="skills" value="JavaScript" />
          JavaScript</label
        >
        <label><input type="checkbox" name="skills" value="Git" /> Git</label>
        <label
          ><input type="checkbox" name="skills" value="React" /> React</label
        >
        <label
          ><input type="checkbox" name="skills" value="Node.js" />
          Node.js</label
        >
      </div>

      <div>
        <label>About Student</label>
        <textarea
          id="about"
          maxlength="200"
          placeholder="Write about student"
        ></textarea>
      </div>

      <div>
        <label>Profile Photo</label>
        <input type="file" id="profile" accept="image/*" />
      </div>

      <button type="submit" id="register">Register Student</button>
      <button type="reset" id="reset">Reset Form</button>
    </form>
   
    <script src="script.js"></script>
  </body>
</html>
