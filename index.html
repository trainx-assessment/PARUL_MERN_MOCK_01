<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>
    <div class="student-form">
        <form id="studentForm">
          <h2>Registration Form</h2>
        <div class="upper">
          <div class="left">
            <div class="name common">
              <label for="studentName">Student Name </label>
              <input
                type="text"
                id="studentName"
                name="studentName"
                placeholder="Student Name"
                required
              />
            </div>
            <div class="email common">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
              />
            </div>
            <div class="gender common">
              <p>Gender</p>
              <div>
                <input type="radio" id="male" name="gender" value="Male" />
                <label for="male">Male</label>
              </div>
              <div>
                <input type="radio" id="female" name="gender" value="Female" />
                <label for="female"> Female </label>
              </div>

              <div>
                <input type="radio" id="other" name="gender" value="Other" />

                <label for="other"> Other </label>
              </div>
            </div>
            <div class="about common">
              <label for="about"> About Student </label>

              <textarea
                id="about"
                name="about"
                maxlength="200"
                placeholder="Tell us about the student..."
              ></textarea>
            </div>
            <div class="photo common">
              <label for="photo"> Profile Photo </label>

              <input type="file" id="photo" name="photo" accept="image/*" />
            </div>
          </div>
          <div class="right">
            <div class="number common">
              <label for="phone">Phone Number</label>
              <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Phone Number"
                required
              />
            </div>
            <div class="dob common">
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" name="dob" required />
            </div>
            <div class="course common">
              <label for="course"> Course </label>

              <select id="course" name="course">
                <option value="">Select Course</option>

                <option value="Web Development">Web Development</option>

                <option value="UI/UX">UI/UX</option>

                <option value="Python">Python</option>

                <option value="Data Analytics">Data Analytics</option>

                <option value="MERN Stack">MERN Stack</option>

                <option value="Cloud Computing">Cloud Computing</option>
              </select>
            </div>

            <div class="skill common">
              <p>Skills</p>

              <div>
                <input type="checkbox" id="html" name="skills" value="HTML" />

                <label for="html"> HTML </label>
              </div>

              <div>
                <input type="checkbox" id="css" name="skills" value="CSS" />

                <label for="css"> CSS </label>
              </div>

              <div>
                <input
                  type="checkbox"
                  id="javascript"
                  name="skills"
                  value="JavaScript"
                />

                <label for="javascript"> JavaScript </label>
              </div>

              <div>
                <input type="checkbox" id="git" name="skills" value="Git" />

                <label for="git"> Git </label>
              </div>

              <div>
                <input type="checkbox" id="react" name="skills" value="React" />

                <label for="react"> React </label>
              </div>

              <div>
                <input
                  type="checkbox"
                  id="node"
                  name="skills"
                  value="Node.js"
                />

                <label for="node"> Node.js </label>
              </div>
            </div>
        
          </div>
        </div>

        <div class="buttons">
          <button type="submit" class="btn">Register Student</button>

          <button type="reset">Reset Form</button>
        </div>
      </form>
    </div>

  </body>
</html>
