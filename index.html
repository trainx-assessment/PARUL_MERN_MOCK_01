<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-class">
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>
        </div>
    </header>

    <main class="container">

        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm" novalidate>
                <div class="form-grid">

                    <div class="form-group">

                        <label for="studentName">Student Name</label>

                        <input
                            type="text"
                            id="studentName"
                            name="studentName"
                            placeholder="Enter student name"
                            maxlength="40"
                        >

                        <small class="error-message" id="studentNameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email"
                        >

                        <small class="error-message" id="emailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Phone Number</label>

                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10 digit phone number"
                            maxlength="10"
                        >

                        <small class="error-message" id="phoneError"></small>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                        >

                        <small class="error-message" id="dobError"></small>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <div class="radio-group">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                >
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                >
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                >
                                Other
                            </label>

                        </div>

                        <small class="error-message" id="genderError"></small>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>

                        <select id="course" name="course">

                            <option value="">Select Course</option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="UI/UX">
                                UI/UX
                            </option>

                            <option value="Python">
                                Python
                            </option>

                            <option value="Data Analytics">
                                Data Analytics
                            </option>

                            <option value="MERN Stack">
                                MERN Stack
                            </option>

                            <option value="Cloud Computing">
                                Cloud Computing
                            </option>

                        </select>

                        <small class="error-message" id="courseError"></small>
                    </div>

                    <div class="form-group full-width">

                        <label>Skills</label>

                        <div class="checkbox-group">

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="HTML"
                                >
                                HTML
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="CSS"
                                >
                                CSS
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="JavaScript"
                                >
                                JavaScript
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="Git"
                                >
                                Git
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="React"
                                >
                                React
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="Node.js"
                                >
                                Node.js
                            </label>

                        </div>

                        <small class="error-message" id="skillsError"></small>
                    </div>

                    <div class="form-group full-width">
                        <label for="about">About Student</label>
                        <textarea 
                            name="about" 
                            id="about" 
                            maxlength="200"
                            placeholder="Tell us about the student"
                            >
                        </textarea>

                        <div class="character-counter">
                            <span id="charCount">0</span> / 200
                        </div>

                        <small class="error-message" id="aboutError"></small>
                    </div>


                </div>

                <div class="form-buttons">

                    <button 
                        type="submit"
                        id="submitBtn"
                        class="btn primary-btn"
                    >
                        Register Student 
                    </button>

                    <button 
                        type="button"
                        id="resetBtn"
                        class="btn secondary-btn"
                        >
                        Reset Form 
                    </button>

                </div>

            </form>

        </section>

        <section class="statistics-section">

            <h2>Student Statistics</h2>

            <div class="stats-grid">

                <div class="stat-card total-card">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div class="stat-card">
                    <h3>Web Development</h3>
                    <p id="webDevelopmentCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>UI/UX</h3>
                    <p id="uiuxCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Python</h3>
                    <p id="pythonCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Data Analytics</h3>
                    <p id="dataAnalyticsCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>MERN Stack</h3>
                    <p id="mernCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Cloud Computing</h3>
                    <p id="cloudCount">0</p>
                </div>

            </div>

        </section>

        
    </main>
    <script src="script.js"></script>
</body>
</html>
