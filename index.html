<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <h3>Register and manage student applications</h3>
    </header>
    
    <section>
       
            <form action="#">
                <div class="group">
                    <label for="">Name:</label>
                    <input type="text" placeholder="Sharanteja">
             
                </div>
                <div class="group">
                    <label for="">Phone No:</label>
                    <input type="text" placeholder="+91xxxxxxxxxx">
                </div>
                <div class="group">
                    <label for="">Gender: </label>
                    <input type="radio">
                    <label for="">Male</label>
                    <input type="radio">
                    <label for="">Female</label>
                </div>

                <div class="group">
                    <label for="">Email:</label>
                    <input type="email" placeholder="abc@gmail.com">
                </div>
                <div class="group">
                    <label for="">Date of Birth:</label>
                    <input type="date">
                </div>
                <div class="group">
                    <label for="">course:</label>  
                       
                        <select  name="course" id="course" placeholder="select">required
                        <option value="">select course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                      
                </div>
                
                <div class="group">
                     <label for="">Skills: </label>
                    <input type="checkbox">
                    <label>HTML</label>
                    
                    <input type="checkbox">
                    <label>CSS</label>
                    
                    <input type="checkbox">
                    <label>Javascript</label>
                    
                    <input type="checkbox">
                    <label>Git</label>
                    
                    <input type="checkbox">
                    <label>React</label>
                    
                    <input type="checkbox">
                    <label>Node.js</label>               
                </div>

                <div class="group">
                    <label for="">Profile photo:</label>
                    <input type="file">   
                </div>

                <div class="group">
                    <label for="">About:</label>
                    <input type="max">
                </div>
            </form>
          
    </section>    
        <button>Register</button> 
        <button>Reset</button>

    <script src="script.js"></script>

</body>
</html>
