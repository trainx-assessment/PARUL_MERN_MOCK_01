<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Student Application Manager</h1>
        <p>Register and manage student applications.</p>
      </header>

      <section class="form-section">
        <h2>Student Registration</h2>

        <form id="studentForm" novalidate>
          <div class="form-group">
            <label for="studentName">Student Name</label>
            <input
              type="text"
              id="studentName"
              name="studentName"
              placeholder="Enter student name"
            />
            <small class="error" id="studentNameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter email address"
            />
            <small class="error" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="text"
              id="phone"
              name="phone"
              placeholder="Enter 10-digit phone number"
              maxlength="10"
            />
            <small class="error" id="phoneError"></small>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" />
            <small class="error" id="dobError"></small>
          </div>

          <div class="form-group">
            <span class="label">Gender</span>

            <div class="options">
              <label>
                <input type="radio" name="gender" value="Male" />
                Male
              </label>

              <label>
                <input type="radio" name="gender" value="Female" />
                Female
              </label>

              <label>
                <input type="radio" name="gender" value="Other" />
                Other
              </label>
            </div>

            <small class="error" id="genderError"></small>
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course">
              <option value="">Select a course</option>
              <option value="Web Development">Web Development</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Python">Python</option>
              <option value="Data Analytics">Data Analytics</option>
            </select>
            <small class="error" id="courseError"></small>
          </div>
        <!-- this one is technology sections  -->
          <!-- <div class="form-icons">
            <label for="technology">technology</label>
            <select name="technology" id="technology">
            <option value="">Select a technology</option>
            <option value="Mongodb">Mongodb</option>
            <option value="ExpressJS">ExpressJS</option>
            <option value="React">React</option>
            <option value="NodeJs">NodeJs</option>
            </select>

          </div> -->
          <div class="form-group">
            <span class="label">Skills</span>

            <div class="options">
              <label>
                <input type="checkbox" name="skills" value="HTML" />
                HTML
              </label>

              <label>
                <input type="checkbox" name="skills" value="CSS" />
                CSS
              </label>

              <label>
                <input type="checkbox" name="skills" value="JavaScript" />
                JavaScript
              </label>

              <label>
                <input type="checkbox" name="skills" value="Git" />
                Git
              </label>
            </div>
            <small class="error" id="skillsError"></small>
          </div>

          <div class="form-group">
            <label for="about">About Student</label>
            <textarea
              id="about"
              name="about"
              rows="4"
              placeholder="Write something about the student"
            ></textarea>
            <small class="error" id="aboutError"></small>
          </div>

          <div class="form-group">
            <label for="profilePhoto">Profile Photo</label>
            <input
              type="file"
              id="profilePhoto"
              name="profilePhoto"
              accept="image/*"
            />
            <small class="error" id="profilePhotoError"></small>
          </div>

          <button type="submit" class="submit-btn">Add Student</button>
        </form>
      </section>

      <section class="students-section">
        <div class="students-header">
          <h2>Registered Students</h2>
          <p id="studentCount">Total Students: 0</p>
        </div>

        <div id="studentContainer" class="student-container"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
