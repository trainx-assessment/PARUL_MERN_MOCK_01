<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <section class="Student Registration Form">
            <form >
                <p class="title">Student Registration Form</p>
                <div class="input">
                    <div class="name">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" required>
                        <br><br>
                        <!-- <div class="email"> -->
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        <!-- </div> -->
                </div>
                <br><br>
                <div class="sub2">
                    <label for="phn">Phone Number</label>
                    <input type="text" id="phn" required>
                    <br><br>
                    <!-- <div class="dob"> -->
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                    <!-- </div>        -->
                    </div>
                <br><br>
                 <div class="sub3">
                    <div class="gender">
                        <label for="gender">gender</label>
                        <br><br>
                        <input type="radio" id="male" >
                        <label for="male">Male</label>
                        <br>
                        <input type="radio" id="female" >
                        <label for="female">FeMale</label>
                        <br>
                        <input type="radio" id="other" >
                        <label for="other">Other</label>
                        <br><br>
                    </div>
                     <div class="course">
                         <label >Course</label>
                         <select>
                             <option >Select course</option>
                             <option >Web Development</option>
                             <option >UI/UX</option>
                             <option >Python</option>
                             <option value="">Data Analysis</option>
                             <option value="">Mern Stack</option>
                             <option value="">Cloud Computing</option>
                             
                            </select>
                        </div>
                        </div>
                <br><br>
                <div class="sub4">
                    <div class="skills">
                        <label for="skills">Skills</label><br><br>
                        <input type="checkbox">
                        <label >HTML</label><br>
                        <input type="checkbox">
                        <label >CSS</label><br>
                        <input type="checkbox">
                        <label >Java Script</label><br>
                        <input type="checkbox">
                        <label >Git</label><br>
                        <input type="checkbox">
                        <label >React</label><br>
                        <input type="checkbox">
                        <label >Node.js</label><br>
                        <br>
                        <br>
                    </div>
                    </div>
                </div>
        
                <div class="text">
                        <label >About Student</label><br>
                        <textarea name="" id="" minlength="200"></textarea>
                        <br><br>
                    </div>
                    <div class="profile">
                        <label >Profile Photo</label>
                        <input type="file" accept="image" id="profile" required>
                    </div>
                <br>
                <div class="button">
                    <button type="submit">Register Student</button>
                    <button type="reset">Reset Form</button>
                </div>

            </form>

        </section>
        <!-- <section>
            Student Statistics
        </section>
        <section>
            Search and Filter Section
        </section>
        <section>
            Student Cards Container
        </section> -->

    </main>
    <footer>

    </footer>
    
</body>
</html>
