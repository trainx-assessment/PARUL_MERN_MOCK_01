<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="headersec">
                <h1>Studendent Application Management System</h1>
                <p>Register and manage student applications</p>
            </div>
        </header>
        <div class="details">
            <div class="box1">
                <form action="">
                    <label for="">Student Name : </label>
                    <input type="text" required><br><br>
                    <label for="">Email :</label>
                    <input type="email" required><br><br>
                    <label for="">Phone Number :</label>
                    <input type="text" required><br><br>
                </form>
            </div>
            <div class="box2">
                <form action="">
                    <label for="">Date of Birth :</label>
                    <input type="date" required><br><br>
                    <input type="radio">
                    <label for="">Male :</label>
                    <input type="radio">
                    <label for="">female :</label>
                    <input type="radio">
                    <label for="">Other :</label><br><br>
                    <label for="">Course : </label>
                    <select name="Course" id="Course" required>
                        <option value="">Select Course</option> 
                        <option value="">Web Development</option>
                        <option value="">UI/UX</option>
                        <option value="">Python</option>
                        <option value="">Data Analytics</option>
                        <option value="">MERN Stack</option>
                        <option value="">Cloud Computing</option>

                    </select><br><br>

                    <label for="">Skills : </label>
                    <input type="checkbox">
                    <label for="">HTML </label>
                    <input type="checkbox">
                    <label for="">CSS</label>
                    <input type="checkbox">
                    <label for="">Git</label>
                    <input type="checkbox">
                    <label for="">React</label>
                    <input type="checkbox">
                    <label for="">Node.js</label> <br><br>
                </form>
            </div>

            <div class="box3">
                <form class="formbox3">
                    <label for="">About Student : </label>
                    <input type="textarea" maxlength="200" placeholder="Maximum 200 characters"><br><br>

                    <label for="">Profile Photo</label>
                    <input type="file"><br>
                    <button>Register Student</button>
                    <button>Reset Form</button>
                </form>
            </div>
        </div>
    </div>

 <script src="script.js"></script>
</body>

</html>
