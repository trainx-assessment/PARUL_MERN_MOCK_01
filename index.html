<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    
    <div class="heading1">
    <h1 id="one">Student Application Management System</h1>
    
    
    </div>
    <div class="heading2">
     <h2 id="two">Register and manage Student apllication</h2>
    </div>
  <div class="below">
  <div class="left">
    <!-- //Student name -->
    <label for="studentName">Student Name <span class="required">:</span></label>
          <input type="text" id="studentName" placeholder="Enter your name"><br><br>
    <!-- //Student Phone Number      -->
    <label for="studentPhone">Phone Number <span class="required">:</span></label>
          <input type="tel" id="studentPhone"  placeholder="Enter mobile number" required><br><br>
    <!-- //Gender      -->
    <label>Gender <span class="required"></span>:</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="Male" required> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Other"> Other</label>
            </div><br><br>
    
  </div>
  <div class="right">
    <!-- //Student email -->
    <label for="studentEmail">Email <span class="required">:</span></label>
            <input type="email" id="studentEmail" placeholder="Enter yor Email"><br><br>
    <!-- //DOB      -->
    <label for="studentDob">Date of Birth <span class="required">:</span></label>
            <input type="date" id="studentDob"><br><br> 
    <!-- //Select Your COurse     -->
    <label for="studentCourse">Course <span class="required">:</span></label>
            <select id="studentCourse">
              <option value="">Select Course</option>
              <option value="Web Development">Web Development</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Python">Python</option>
              <option value="Data Analytics">Data Analytics</option>
              <option value="MERN Stack">MERN Stack</option>
              <option value="Cloud Computing">Cloud Computing</option>
            </select><br><br>       
  </div>
  </div>
    <div class="bottom">
    <!-- //Select your skill      -->
    <label>Skills <span class="required">:</span></label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="skills" value="HTML"> HTML</label><br>
              <label><input type="checkbox" name="skills" value="CSS"> CSS</label><br>
              <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label><br>
              <label><input type="checkbox" name="skills" value="Git"> Git</label><br>
              <label><input type="checkbox" name="skills" value="React"> React</label><br>
              <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
            </div><br>

    <!-- //About     -->
    <label for="studentAbout">About<span class="required">:</span></label><br>
            <textarea id="studentAbout" name="studentAbout" maxlength="200" rows="6" placeholder="Write About Yourself"></textarea><br><br>
            <!-- <div class="char-counter"><span id="charCount">0</span> / 200</div><br><br> -->

    <!-- //Add Your Photo      -->
    <label for="studentPhoto">Profile Photo <span class="required">:</span></label>
            <input type="file" id="studentPhoto"><br><br>

    <!-- //Buttons -->
        <div class="buttons">
          <button type="submit" id="submitBtn">Register Student</button>
          <button type="reset" id="resetBtn">Reset Form</button>
        </div>
    </div> 
      
      
   
  </main>

  <script src="script.js"></script>
</body>
</html>
