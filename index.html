<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Application Management System (SAMS)</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
  </header>

  <main>

    <section> 

      <form id="studentForm">
        <div class="form-row">
          <label for="name"> <b>Student Name </b></label>
          <input type="text" id="name" required>
        </div>
        <br>
        <div class="form-row">
          <label for="email"><b> Email </b></label>
          <input type="email" id="email" required>
        </div>
        <br>
        <div class="form-row">
          <label for="phone"><b>Phone Number </b></label>
          <input type="text" id="phone" required>
        </div>
        <br>

        <div class="form-row">
          <label for="dob"><b> Date of Birth</b></label>
          <input type="date" id="dob" required>
        </div>
        <br>

        <div class="form-row">
          <label><b>Gender</b></label>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female"> Female
          <input type="radio" name="gender" value="Other"> Other
        </div>
        <br>

        <div class="form-row">
          <label for="course"><b>Course</b></label>
          <select id="course">
            <option>Select Course</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
          </select>
        </div>
        <br>
        
        <div class="form-row">
          <label><b>Skills</b></label>
          <input type="checkbox" value="HTML"> HTML
          <input type="checkbox" value="CSS"> CSS
          <input type="checkbox" value="JavaScript"> JavaScript
          <input type="checkbox" value="Git"> Git
          <input type="checkbox" value="React"> React
          <input type="checkbox" value="Node.js"> Node.js
        </div>
        <br>
    
        <div class="form-row">
          <label for="about"> <b>About Student</b></label>
          <textarea id="about" maxlength="200"></textarea>
          <small id="charCount">0 / 200</small>
        </div>
        <br>

        <div class="form-row">
          <label for="Profile-photo"><b>Upload Profile Photo</b></label>
          <input type="file" id="Profile-photo" accept="image/*">
        </div>
        <br>

        <div class="form-row">
    
          <button type="submit">Register Student</button>
          <button type="reset">Reset Form</button>
        </div>
        <br>
      </form>

    </section> 

    </main>
    </body>

    <footer>
      
    </footer>
    <p> </p>
    </html>
