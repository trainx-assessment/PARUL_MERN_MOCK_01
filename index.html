<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
    <main class="student-form">
        <form id="student-form" novalidate>
            <div class="two-column-div">
            <div class="name-div">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <span class="error-message" id="name-error"></span>
            </div>
            
            <div class="email-div">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="email-error"></span>
            </div>
            
            <div class="phone-div">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <span class="error-message" id="phone-error"></span>
            </div>

            <div class="dob-div">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <span class="error-message" id="dob-error"></span>
            </div>

            <div class="gender-div">
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other" required>
            <label for="other">Other</label>
            <span class="error-message" id="gender-error"></span>
            </div>

            <div class="course-div">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="web-development">Web Development</option>
                <option value="ui-ux">UI/UX</option>
                <option value="python">Python</option>
                <option value="data-analytics">Data Analytics</option>
                <option value="mern-stack">MERN Stack</option>
                <option value="cloud-computing">Cloud Computing</option>
            </select>
            <span class="error-message" id="course-error"></span>
            </div>

            <div class="skills-div">
            <label for="skills">Skills:</label>
            <input type="checkbox" id="html" name="skills" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="skills" value="javascript">
            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="git" name="skills" value="git">
            <label for="git">Git</label>
            <input type="checkbox" id="react" name="skills" value="react">
            <label for="react">React</label>
            <input type="checkbox" id="nodejs" name="skills" value="nodejs">
            <label for="nodejs">Node.js</label>
            <span class="error-message" id="skills-error"></span>
            </div>

            </div>

            <div class="about-student-div">
            <label for="about">About Student:</label>
            <textarea id="about" name="about" maxlength="200" required></textarea>
            <span class="character-counter" id="char-counter">0 / 200</span>
            <span class="error-message" id="about-error"></span>
            </div>
            
            <div class="profile-photo">
            <label for="profile-photo">Profile Photo:</label>
            <input type="file" id="profile-photo" name="profile-photo" accept="image/*" required>
            <span class="error-message" id="profile-photo-error"></span>
            </div>

            <div class="two-column-div">
            <button type="submit">Register Student</button>
            <button type="reset">Reset Form</button>
            </div>
        </form>

        <div class="search-div">
            <label for="student-search">Search Students:</label>
            <input type="text" id="student-search" placeholder="Search student by name...">
            <label for="course-filter">Filter by Course:</label>
            <select id="course-filter">
                <option value="">All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </div>

        <section class="student-cards-div">
        </section>

        <section class="statistics-section">
            <div class="total-students">Total Students: <span>0</span></div>
            <div>Web Development: <span id="web-development-count">0</span></div>
            <div>UI/UX: <span id="ui-ux-count">0</span></div>
            <div>Python: <span id="python-count">0</span></div>
            <div>Data Analytics: <span id="data-analytics-count">0</span></div>
            <div>MERN Stack: <span id="mern-stack-count">0</span></div>
            <div>Cloud Computing: <span id="cloud-computing-count">0</span></div>
        </section>
    </main>
</body>
<script src="script.js">
</script>
</html>
