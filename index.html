<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="heading">Student Application Management<br> System</h1>
    </header>
    <main>
        <section class="registration-section">
            <div class="fm">
                <h2>Student Registration</h2>
                <form>
                    <label for="name">Student Name:</label>
                    <input type="text" id="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" required>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" required>
                    <label>Gender:</label>
                    <div class="radio-group">
                        <input type="radio" name="gender" id="male" value="male">
                        <label for="male">Male</label>                        <input type="radio" name="gender" id="female" value="female">
                        <label for="female">Female</label>
                        <input type="radio" name="gender" id="other" value="other">
                        <label for="other">Other</label>
                    </div>
                    <label for="course">Course:</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="web development">Web Development</option>
                        <option value="uiux">UI/UX</option>
                        <option value="python">Python</option>
                        <option value="data analytics">Data Analytics</option>
                        <option value="mern">MERN Stack</option>
                        <option value="cloud">Cloud Computing</option>
                    </select>
                    <label>Skills:</label>
                    <div class="skills-group">
                        <input type="checkbox" id="html" value="HTML">
                        <label for="html">HTML</label>

                        <input type="checkbox" id="css" value="CSS">
                        <label for="css">CSS</label>

                        <input type="checkbox" id="javascript" value="JavaScript">
                        <label for="javascript">JavaScript</label>

                        <input type="checkbox" id="git" value="Git">
                        <label for="git">Git</label>

                        <input type="checkbox" id="react" value="React">
                        <label for="react">React</label>

                        <input type="checkbox" id="node" value="Node.js">
                        <label for="node">Node.js</label>
                    </div>

                    <label for="about" class="full">About Student:</label>
                    <textarea id="about" class="full" maxlength="200" placeholder="Maximum 200 characters"></textarea>
                    <label for="photo" class="full">Profile Photo:</label>
                    <input type="file" id="photo" class="full" accept="image/*">
                    <div class="button-group">
                        <button type="submit">Register Student</button>
                        <button type="reset">Reset Form</button>
                    </div>
                </form>
            </div>
        </section>
        <section class="statistics-section">
    <h2>Student Statistics</h2>

    <div class="statistics">
        <div class="stat-card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Web Development</h3>
            <p id="webDevelopment">0</p>
        </div>

        <div class="stat-card">
            <h3>UI/UX</h3>
            <p id="uiux">0</p>
        </div>

        <div class="stat-card">
            <h3>Python</h3>
            <p id="python">0</p>
        </div>

        <div class="stat-card">
            <h3>Data Analytics</h3>
            <p id="dataAnalytics">0</p>
        </div>

        <div class="stat-card">
            <h3>MERN Stack</h3>
            <p id="mern">0</p>
        </div>

        <div class="stat-card">
            <h3>Cloud Computing</h3>
            <p id="cloud">0</p>
        </div>
    </div>
</section>

        <section class="search-section">
            <h2>Search and Filter Students</h2>

            <input type="text" id="search" placeholder="Search by name or email">

            <select id="filterCourse">
                <option value="">All Courses</option>
                <option value="web development">Web Development</option>
                <option value="uiux">UI/UX</option>
                <option value="python">Python</option>
                <option value="data analytics">Data Analytics</option>
                <option value="mern">MERN Stack</option>
                <option value="cloud">Cloud Computing</option>
            </select>
        </section>

        <section class="students-section">
            <h2>Student Applications</h2>

            <div class="student-list"></div>
        </section>

    </main>

    <footer class="footerr">
        <p>Student Application Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
