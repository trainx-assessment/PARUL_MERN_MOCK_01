<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Manage Ur Students here</p>
    </header>
     <main>
        <section class="form-section">
            <h2>Student Registration</h2>
            <form id="studentForm">
                <div class="form-grid">
                    <div>
                        <label for="studentName">Student Name : </label>
                        <input type="text" id="studentName">
                    </div>

                    <div>
                        <label for="email">Email : </label>
                        <input type="email" id="email">
                    </div>

                    <div>
                        <label for="phone">Phone Number : </label>
                        <input type="text" id="phone">
                    </div>

                    <div>
                        <label for="dob">Date Of Birth : </label>
                        <input type="date" id="dob">
                    </div>

                    <div> 
                        <label>Gender :</label>
                        <div class="radio-class">
                            <label>
                                <input type="radio"> Male
                            </label>
                            <label>
                                <input type="radio">Female
                            </label>
                            <label>
                                <input type="radio">Others
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="course">Course : </label>
                        <select id="course">
                            <option value="">Select Course</option>
                            <option>Web Development</option>
                            <option>UI/UX</option>
                            <option>Python</option>
                            <option>Data Analytics</option>
                            <option>MERN Stack</option>
                            <option>Cloud Computing</option>
                        </select>
                    </div>

                    <div>
                        <label>Skills</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox">HTML</label>
                            <label><input type="checkbox">CSS</label>
                            <label><input type="checkbox">JavaScript</label>
                            <label><input type="checkbox">Git</label>
                            <label><input type="checkbox">React</label>
                            <label><input type="checkbox">Node.js</label>
                        </div>
                    </div>

                    <div class="full-width">
                        <label for="about">About Student</label>
                        <textarea id="about" maxlength="200" placeholder="Write about the student"></textarea>
                        <p id="counter">0 / 200</p>
                    </div>

                    <div class="full-width">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo">
                    </div>
                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">Register</button>
                    <button type="button" id="resetBtn">Reset</button>
                </div>
            </form>

        </section>
     </main>

     <footer>
        <p>Student Application Management System</p>
     </footer>

     <script src="script.js"></script>
    
</body>
</html>
