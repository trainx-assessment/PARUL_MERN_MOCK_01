<!DOCTYPE html>
<html>
<head>
    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <section class="form-section">
            <h2>Register Student</h2>
           <form id="student-form">
    <div class="form-grid">
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="student-name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="student-email">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="student-phone">
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="student-dob">
        </div>

        <div class="form-group">
            <label>Gender</label>

            <div>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>
        </div>

        <div class="form-group">
            <label>Course</label>

            <select id="student-course">
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>
        </div>

        <div class="form-group">
            <label>Skills</label>

            <div>
                <input type="checkbox" value="HTML"> HTML
                <input type="checkbox" value="CSS"> CSS
                <input type="checkbox" value="JavaScript"> JavaScript
                <br>
                <input type="checkbox" value="Git"> Git
                <input type="checkbox" value="React"> React
                <input type="checkbox" value="Node.js"> Node.js
            </div>
        </div>

        <div class="form-group">
            <label>About Student</label>

            <textarea id="student-about" 
            rows="4" maxlength="200"
            placeholder="Maximum 200 characters">
        </textarea>

<p id="character-count">0 / 200</p>
        </div>

        <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" id="student-photo">
        </div>

    </div>

    <div class="button-group">
        <button type="submit">Register Student</button>
        <button type="reset">Reset</button>
    </div>

</form>
        </section>
    </main>
    <footer>
        <p>
            Student Application Management System
        </p>
    </footer>

</body>
</html>
