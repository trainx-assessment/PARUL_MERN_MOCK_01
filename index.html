<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>
<body>
  <header>
    <h1>Student Application
      Management System</h1>
      <p>Register and manage student application</p>
  </header>
  <main>
    <section id="registration-section">
      <h2>Student Registration</h2>
      <form id="student-form">
        <div class="form-group">
          <label for="student">Student Name</label>
          <input type="text" id="student" name="student">
          <small class="error" id="studenterror"></small>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
          <small class="error" id="emailError"></small>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone">
          <small class="error" id="PhoneError"></small>
        </div>
        <div class="form group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
          <small class="error" id="doberror"></small>
        </div>
          <div class="form-group">
            <label>Gender</label>
            <label><input type="radio" name="gender" value="Male">Male</label>
            <label><input type="radio" name="gender" value="Female">Female</label>
            <label><input type="radio" name="gender" value="Other">Other</label>
            <small class="error" id="genderError"></small>
                </div>
                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="">MERN Stack</option>
                        <option value="Java">Java</option>
                        <option value="Python">Python</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Cyber Security">Cyber Security</option>
                    </select>
                    <small class="error" id="courseError"></small>
                </div>
                <div class="form-group">
                    <label>Skills</label>
                    <label>
                        <input type="checkbox" name="skills" value="HTML">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="CSS">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="JavaScript">
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="React">
                        React
                    </label>

                    <small class="error" id="skillsError"></small>
                </div>
                <div class="form-group">
                    <label for="about">About</label>

                    <textarea
                        id="about"
                        name="about"
                        maxlength="200"
                        rows="5"
                        placeholder="Tell us about yourself..."></textarea>
                    <div>
                        <span id="charCount">0</span>/200
                    </div>

                    <small class="error" id="aboutError"></small>
                </div>
                <div class="form-group">
                    <label for="profilePhoto">Profile Photo</label>

                    <input
                        type="file"
                        id="profilePhoto"
                        name="profilePhoto"
                        accept=".jpg,.jpeg,.png">
                    <small class="error" id="photoError"></small>
                </div>
                <div class="buttons">
                    <button type="submit" id="submitButton">
                        Register Student
                    </button>
                    <button type="reset" id="resetButton">
                        Reset Form
                    </button>
                </div>

            </form>
        </section>

    </main>
    <footer>
        <p>Student Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
