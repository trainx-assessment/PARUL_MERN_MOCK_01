<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- header -->
    <header class="header">
        <h1>Student Application Management System</h1>
    </header>
    <br><br>
<!-- main content -->
    <main class="main">
        <h2>Student Application</h2>
        
        
        <section class="section1">
<!--  student Application Form -->
    
            <form action="#" method="post">
                <label for="studentName">Name:</label>
                <input type="text" id="studentName" name="studentName" placeholder="John Doe" required>
                <br><br>
                <label for="studentEmail">Email:</label>
                <input type="email" id="studentEmail" name="studentEmail" placeholder="john.doe@example.com" required>
                <br><br>
                <label for="studentPhone">Phone:</label>
                <input type="tel" id="studentPhone" name="studentPhone" placeholder="123-456-7890" required>
                <br><br>
                <label for="studentDate">DATE OF Birth</label>
                <input type="date" id="StudentDate" name="StudentDate" required>
                <br><br>
                <label for="gender">Gender:</label>
                <div class="gender" id="gender">
                    <br>
                male<input type="radio" id="gender" name="gender" value="male">
                <br>
                female<input type="radio" id="gender" name="gender" value="female">
                <br>
                other<input type="radio" id="gender" name="gender" value="other">
                </div>
                <br><br>
                <div class="cours">
                <label for="cours">COURSE</label>
                <select name="cours" id="cours">
                    <option>Web Development</option>
                    <option>UI/UX</option>
                    <option>Python</option>
                    <option>Data Analytics</option>
                    <option>MERN Stack</option>
                    <option>Cloud Computing</option>
                </select>
                </div>

                <br><br>
                <div class="skills">
                <label for="skills">SKILLS</label>
                <br>
                <input type="checkbox" id="h">HTML
                <br>
                <input type="checkbox" id="c">CSS
                <br>
                <input type="checkbox" id="j">JavaScript
                <br>
                <input type="checkbox" id="g">GIT
                <br>
                <input type="checkbox" id="r">React
                </div>
                

                <br><br>
                <label for="self">ABOUT YOUR SELF :</label>
                <br>
                <input type="text" id="self" class="self">
                <br><br>
                <label for="photo">PROFILE PHOTO</label>
                <input type="file" name="photo" id="photo">
                <br><br>
                <div class="buttons">
                    <label for="subBtn">Click here to submit</label>
                <button class="subtn" id="subBtn">Submit</button>
<br>
                    <label for="resbtn">Click here to reset</label>
                <button class="resbtn" id="resbtn" onclick="reset()">RESET FORM</button>
                </div>
            </form>
    
        </section>
<!-- student card section -->
        <section class="section2">
        </section>
    </main>


<!-- footer section -->
    <footer class="footer">
        <div class="colum1">
            <ul>
                <li>Parul University</li>
                <li>vadodara</li>
                <li>gujart</li>
                <li>391001</li>
            </ul>

        </div>
        <div class="colum2">
            <ul>
                <li>contact us</li>
            </ul>

        </div>
        <div class="colum3">
            <ul>
                <li>made by</li>
            </ul>

        </div>

    </footer>
    




    <script src="script.js"></script>
</body>
</html>
