<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-box">
            <h1>Student Management</h1>
        </div>
    </header>

    <main>

        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-box">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName">
                    </div>


                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                        <small id="emailError"></small>
                    </div>


                    <div class="input-box">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone">
                        <small id="phoneError"></small>
                    </div>


                    <div class="input-box">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                        <small id="dobError"></small>
                    </div>


                    <div class="input-box">

                        <label>Gender</label>

                        <div class="radio-area">

                            <label>
                                <input type="radio" name="gender" value="Male">
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender" value="Female">
                                Female
                            </label>

                        </div>

                    </div>


                    <div class="input-box">

                        <label for="course">Course</label>

                        <select id="course">

                            <option value="">Select Course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Python">Python</option>
                            
                        </select>

                        <small id="courseError"></small>

                    </div>


                    <div class="input-box full-width">

                        <label>Skills</label>

                        <div class="skills-area">

                            <label>
                                <input type="checkbox" name="skill" value="JavaScript">
                                JavaScript
                                        
                            </label>

                            <label>
                                <input type="checkbox" name="skill" value="Git">
                                Git
                             
                            </label>

                            <label>
                                <input type="checkbox" name="skill" value="React">
                                React
                             
                            </label>

                            <label>
                                <input type="checkbox" name="skill" value="Node.js">
                                Node.js
                             
                            </label>

                        </div>

                        <small id="skillsError"></small>

                    </div>


                    <div class="input-box full-width">

                        <label for="about">About Student</label>

                        <textarea
                            id="about"
                            maxlength="150"
                            placeholder="Write something about the student..."
                        >

                    </div>


                    <div class="input-box full-width">

                        <label for="photo">Profile Photo</label>

                        <input
                            type="file"
                            id="photo"
                            accept=".jpg"
                        >

                        <small id="photoError"></small>

                    </div>

                </div>


                <div class="form-buttons">

                    <button type="submit" id="submitBtn">
                        Register
                    </button>
                </div>

            </form>

        </section>


    

    </main>
    <script src="script.js"></script>

</body>
</html>
