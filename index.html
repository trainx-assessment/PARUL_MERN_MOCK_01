<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Application</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>

        <section class="form-section">
            <h2>Student Registration</h2>
            
            <form id="studentForm">

                <section class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" required>
                </section>
                

                <section class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </section>

                <section class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </section>

                <section class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </section>

                <section class="form-group">
                    <label>Gender</label>

                    <section class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </section>
                </section>

                <section class="form-group">
                    <label for="course">Course</label>

                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option>Web Development</option>
                        <option>UI/UX</option>
                        <option>Python</option>
                        <option>Data Analytics</option>
                    </select>
                </section>

                <section class="form-group">
                    <label>Skills</label>

                    <section class="checkbox-group">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>
                    </section>
                </section>

                <section class="form-group">
                    <label for="about">About Student</label>
                    <textarea id="about" rows="4" required></textarea>
                </section>

                <section class="form-group">
                    <label for="photo">Profile Photo</label>
                    <input type="file" id="photo" accept="image/*">
                </section>

                <button type="submit">Register Student</button>

            </form>
            <section class="count-section"> <h2>Total Students</h2> <p id="studentCount">0</p> </section> 
             <section class="students-section">
                 <h2>Registered Students</h2>
                  <section id="studentCards" class="student-cards"> 

                  </section>
                 </section>
            <script src="script.js"></script>
       
    </main>

</body>
</html>
