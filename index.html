<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>

    <main>
      <form action="" class="studentRegForm">
        <div class="detail">
          <div class="dr">
            <label for="Name" >Name:</label>
            <input type="text" id="Name" placeholder="Name" required/>
          </div>
          <div class="dr">
            <label for="email">Email:</label>
            <input type="email" name="" id="email" placeholder="abc@example.com" required/>
          </div>
          <div class="dr">
            <label for="Pno">Phone Number:</label>
            <input type="tel" name="" id="Pno" placeholder="+91 12345 67889" />
          </div>
          <div class="dr">
            <label for="Dob">Date Of Birth:</label>
            <input type="date" name="" id="Dob" />
          </div>

          <div class="gender dr">
            <label for="Gender">Gender:</label>
            <div class="g">

                <input type="radio" name="Gender" id="Male" value="Male" /> Male
            </div>
            <div class="g">
                <input type="radio" name="Gender" id="Female" value="Female" />
                Female
            </div>
            <div class="g">
                <input type="radio" name="Gender" id="Others" value="Others" />
                Others
            </div>
          </div>
          <div class="dr">
              <label for="Course">Course: </label>
              <select name="Course" id="">
                <option value="Select Course" disabled selected hidden>Select Course</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
              </select>
          </div>
        </div>
        <div class="skills dr">
          <label for="Skill">Skill:</label>
          <input type="checkbox" name="Skill" id=""  /> HTML
          <input type="checkbox" name="Skill" id="" /> CSS
          <input type="checkbox" name="Skill" id="" /> JavaSript
          <input type="checkbox" name="Skill" id="" /> Git
          <input type="checkbox" name="Skill" id="" /> React
          <input type="checkbox" name="Skill" id="" /> Node.js
        </div>

        <div class="aboutyou">
            <label for="abtyou">About You</label>
            <textarea
              name="abtyou"
              id=""
              maxlength="200"
              placeholder="Maxmimum length 200"
            ></textarea>
        </div>

        <div class="pfp">
            <label for="pfp">Upload Profile Picture</label>
            <input type="file" name="pfp" id="" />
        </div>
        <div class="buttons">
          <button class="regStudent">Register Student</button>
          <button class="reset">Reset</button>
        </div>
      </form>
      <section class="studentStats">
        <div class="card"></div>
      </section>
      <section class="searchStudent"></section>
      <section class="studentCards"></section>
    </main>

    <footer></footer>

    <script src="script.js"></script>
  </body>
</html>
