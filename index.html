<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
        <button id="openModalBtn">Register New Student</button>
    </header>

    <main class="container">
        <section id="statsSection">
            <h2>Student Statistics</h2>
            <p id="totalCount">Total Students: 0</p>
            <div id="courseStats"></div>
        </section>

        <section id="filterSection">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <select id="courseFilter">
                <option value="All">All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </section>

        <section id="studentContainer"></section>
    </main>

    <div id="studentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>Student Registration Form</h2>

            <form id="studentForm" novalidate>
                <div class="form-group">
                    <label for="studentName">Student Name *</label>
                    <input type="text" id="studentName" name="studentName" required>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="text" id="phone" name="phone" required>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label>Gender *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="course">Course *</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label>Skills *</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                        <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="Git"> Git</label>
                        <label><input type="checkbox" name="skills" value="React"> React</label>
                        <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="about">About Student *</label>
                    <textarea id="about" name="about" maxlength="200" required></textarea>
                    <span id="charCounter">0 / 200</span>
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="photo">Profile Photo *</label>
                    <input type="file" id="photo" name="photo" accept="image/*" required>
                    <small class="error-msg"></small>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="button" id="resetBtn">Reset Form</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Application Management System</p>
    </footer>

    <script src="student.js"></script>
</body>
</html>
