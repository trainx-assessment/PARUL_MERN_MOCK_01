<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-bg">
        <main class="container">
            <header class="hero">
                <div class="hero-icon">🎓</div>
                <div>
                    <p class="eyebrow">STUDENT PORTAL</p>
                    <h1>Student Application Manager</h1>
                    <p class="hero-text">Register, organize and manage student applications easily.</p>
                </div>
            </header>

            <section class="form-section">
                <div class="section-title">
                    <div>
                        <p class="section-label">REGISTRATION</p>
                        <h2>Add New Student</h2>
                    </div>
                    <span class="required-note">* Required fields</span>
                </div>

                <form id="studentForm" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="studentName">Student Name <span>*</span></label>
                            <input type="text" id="studentName" placeholder="e.g. Rahul Sharma">
                            <small class="error" id="nameError"></small>
                        </div>

                        <div class="form-group">
                            <label for="email">Email <span>*</span></label>
                            <input type="email" id="email" placeholder="e.g. rahul@gmail.com">
                            <small class="error" id="emailError"></small>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number <span>*</span></label>
                            <input type="text" id="phone" inputmode="numeric" placeholder="10 digit number">
                            <small class="error" id="phoneError"></small>
                        </div>

                        <div class="form-group">
                            <label for="dob">Date of Birth <span>*</span></label>
                            <input type="date" id="dob">
                            <small class="error" id="dobError"></small>
                        </div>

                        <div class="form-group full-width">
                            <label>Gender <span>*</span></label>
                            <div class="options">
                                <label class="choice"><input type="radio" name="gender" value="Male"><span>Male</span></label>
                                <label class="choice"><input type="radio" name="gender" value="Female"><span>Female</span></label>
                                <label class="choice"><input type="radio" name="gender" value="Other"><span>Other</span></label>
                            </div>
                            <small class="error" id="genderError"></small>
                        </div>

                        <div class="form-group">
                            <label for="course">Course <span>*</span></label>
                            <select id="course">
                                <option value="">Select Course</option>
                                <option value="Web Development">Web Development</option>
                                <option value="UI/UX">UI/UX</option>
                                <option value="Python">Python</option>
                                <option value="Data Analytics">Data Analytics</option>
                            </select>
                            <small class="error" id="courseError"></small>
                        </div>

                        <div class="form-group">
                            <label>Skills <span>*</span></label>
                            <div class="options">
                                <label class="choice"><input type="checkbox" name="skills" value="HTML"><span>HTML</span></label>
                                <label class="choice"><input type="checkbox" name="skills" value="CSS"><span>CSS</span></label>
                                <label class="choice"><input type="checkbox" name="skills" value="JavaScript"><span>JavaScript</span></label>
                                <label class="choice"><input type="checkbox" name="skills" value="Git"><span>Git</span></label>
                            </div>
                            <small class="error" id="skillsError"></small>
                        </div>

                        <div class="form-group full-width">
                            <label for="about">About Student <span>*</span></label>
                            <textarea id="about" rows="4" placeholder="Write a short introduction about the student..."></textarea>
                            <small class="error" id="aboutError"></small>
                        </div>

                        <div class="form-group full-width">
                            <label for="photo">Profile Photo <span>*</span></label>
                            <input type="file" id="photo" accept="image/*">
                            <small class="error" id="photoError"></small>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn"> Add Student</button>
                </form>
            </section>

            <section class="student-header">
                <div>
                    <p class="section-label">APPLICATIONS</p>
                    <h2>Registered Students</h2>
                </div>
                <div class="count-badge" id="studentCount">Total Students: 0</div>
            </section>

            <section id="studentContainer" class="student-container"></section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
