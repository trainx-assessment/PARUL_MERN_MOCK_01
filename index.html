                <div class="form">

                </div>

<div class= "form">

              <div class = "form">

<input type="date" id = "dateOfBirth"  name = "dateOfBirth" required>
              </div>
               
<fieldset class = "form">

        male</lable>

</fieldset>
           
                


                        
<div class = "form">
<label for="course"> course</label>

</select></div>
                
                
<filtdset class = "form">

</div>
