<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <h3>Register and manage student applications</h3>
    </header>
    <!-- <form action=""> -->
        <div class="grid">
            <div class="f">
                <label>Name: </label>
                <input type="text" required>
            </div>
            <div class="f">
                <label>E-Mail: </label>
                <input type="email" required>
            </div>
            <div class="f">
                <label>Ph No: </label>
                <input type="text" required>
            </div>
            <div class="f">
                <label>DOB: </label>
                <input type="date" required>
            </div>
            <div class="f">
                <label>Gender: </label>
                <label>Male: </label>
                <input type="radio">
                <label>Female: </label>
                <input type="radio">
                <label>Other: </label>
                <input type="radio">
            </div>
            <div class="f">
                <label>Course: </label>
                <input type="" required>
            </div>
        </div>
        
        <div class="f fa">
            <label>Skills: </label>
            <label>HTML</label>
            <input type="checkbox" >
            <label>CSS</label>
            <input type="checkbox">
            <label>Javascript</label>
            <input type="checkbox">
            <label>Git</label>
            <input type="checkbox">
            <label>React</label>
            <input type="checkbox">
            <label>Node Js</label>
            <input type="checkbox">
        </div>
        <div class="f fa">
            <label>About: </label>
            <input type="text" required placeholder="Maximum 200 characters...">
        </div>
        <div class="f fa">
            <label>Profile Photo: </label>
            <input type="file" required placeholder="Add image files only...">
        </div>
        <div class="button">
            <button class="b b1">Register</button>
            <button class="b b2">Reset</button>
        </div>
    <!-- </form> -->
    <main></main>
    <section class="cards">
        <div class="card card1"></div>
        <div class="card card2"></div>
        <div class="card card3"></div>
    </section>
    
    <footer></footer>
    <script src="script.js"></script>
</body>
</html>
