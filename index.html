<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
        <button id="darkModeBtn">Dark Mode</button>
    </header>

    <main>

        <section id="registration-section">
            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills</label>
                    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="Git"> Git</label>
                    <label><input type="checkbox" name="skills" value="React"> React</label>
                    <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                </div>

                <div class="form-group">
                    <label for="about">About Student</label>
                    <textarea id="about" name="about" maxlength="200" required></textarea>
                    <span id="charCount">0 / 200</span>
                </div>

                <div class="form-group">
                    <label for="photo">Profile Photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="reset" id="resetBtn">Reset Form</button>
                </div>

            </form>
        </section>

        <section id="stats-section">
            <h2>Student Statistics</h2>
            <p id="totalCount">Total Students: 0</p>
            <div id="courseStats">
                <span data-course="Web Development">Web Development: 0</span>
                <span data-course="UI/UX">UI/UX: 0</span>
                <span data-course="Python">Python: 0</span>
                <span data-course="Data Analytics">Data Analytics: 0</span>
                <span data-course="MERN Stack">MERN Stack: 0</span>
                <span data-course="Cloud Computing">Cloud Computing: 0</span>
            </div>
        </section>

        <section id="search-filter-section">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <select id="courseFilter">
                <option value="All">All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </section>

        <section id="students-section">
            <div id="studentContainer">
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Application Management System</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
