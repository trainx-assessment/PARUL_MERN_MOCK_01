<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <title>Student Application Management System</title>
</head>
<body>
    <header>
        <h1 id="headin">Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        <section>
            <form>
                <div class="view1">

                    <div class="v">
                        <div class="view11">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>
                <br>
                </div>
                <div class="view12">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required><br>
                <br>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br>
                <br>
                </div>
                    </div>
                </div>
                <div class="gender">
                <div>
                <label for="gender" id="gender">Gender:</label>

                </div>
                <div>
                    <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
                </div>
                <div>
                    <input type="radio" id="other" name="gender" value="other" required>
                <label for="other">Other</label>
                </div>
                <br>
                </div>
                <div class="dob">
                    <label for="dob" id="dob">Date of Birth:</label> 
                <input type="date" id="data" required >
                </div>
                <br>
                <br>
                <!-- select cource -->
                 <div class="selectcourses">
                    <label for="course" id="course">Couse:</label>
                 <select id="data">
                     <option>Mern stack</option>
                     <option>UI/UX</option>
                     <option>Python</option>
                     <option>Data Analytics</option>
                     <option>Web Development</option>
                     <option>Cloud Computing</option>
                 </select>
                 </div>
                 <!-- checkboxes -->
                  <!-- <label for="Skills">Skills you have</label><br><br>
                    -->
                  
                    <p id="skil"> <span id="ase">*</span>Skills you have</p>
                  
                
                    <div class="checking">
                    <div>
                        <input type="checkbox">
                  <label for="">HTML</label>
                    </div>
                  <div>
                    <input type="checkbox">
                  <label for="">CSS</label>
                  </div>
                  <div>
                    <input type="checkbox">
                  <label for="">JavaScript</label>
                  </div>
                  <div>
                    <input type="checkbox">
                  <label for="">GIT/GITHUB</label>
                  </div>
                  <div>
                    <input type="checkbox">
                  <label for="">React</label>
                  </div>
                  <div><input type="checkbox">
                  <label for="">Node.js</label></div>
                  </div>
                  
                  <br>
                  <br>

                  <p id="skil"><span id="asee">*</span>About Student</p>
                  <textarea minlength="200" id="maxi">>Maximum 200 characters </textarea>
                  <br>
                  <br>
                  <p id="por">Profile Photo</p>
                  <input type="file" id="if">


            </form>
                  

        </section>
        <br>
        <br>
        <div class="footer">
            <button id="RS">Register Student</button>
        <button id="RS">Reset form </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
