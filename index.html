<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Student applications Form</p>
    </header>

    <main>

    
        <section class="form-section">
            <h2>Student Details</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    <small id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone">
                    <small id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                    <small id="dobError"></small>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="options">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>

                    <small id="genderError"></small>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>

                    <small id="courseError"></small>
                </div>

                <div class="form-group">
                    <label>Skills</label>

                    <div class="options">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="React">
                            React
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Node.js">
                            Node.js
                        </label>
                    </div>

                    <small id="skillsError"></small>
                </div>

                <div class="form-group full-width">
                    <label for="about">About Student</label>

                    <textarea
                        id="about"
                        maxlength="200"
                        placeholder="Write something about the student">
                    </textarea>

                    <div id="counter">0 / 200</div>
                    <small id="aboutError"></small>
                </div>

                <div class="form-group full-width">
                    <label for="photo">Profile Photo</label>

                    <input type="file" id="photo" accept="image/*">
                    <small id="photoError"></small>
                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">
                        Register Student
                    </button>

                    <button type="button" id="resetBtn">
                        Reset Form
                    </button>
                </div>

            </form>
        </section>
