<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Application Manager</h1>
            <p>Register and manage student applications</p>
        </header>

        <section class="form-section">
            <h2>Student Registration</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter 10 digit phone number">
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                    <span class="error" id="dobError"></span>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="options">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                    <span class="error" id="genderError"></span>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                    </select>
                    <span class="error" id="courseError"></span>
                </div>

                <div class="form-group">
                    <label>Skills</label>

                    <div class="options">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>
                    </div>

                    <span class="error" id="skillsError"></span>
                </div>

                <div class="form-group">
                    <label for="about">About Student</label>
                    <textarea id="about" rows="4" placeholder="Write something about the student"></textarea>
                    <span class="error" id="aboutError"></span>
                </div>

                <div class="form-group">
                    <label for="photo">Profile Photo</label>
                    <input type="file" id="photo" accept="image/*">
                    <span class="error" id="photoError"></span>
                </div>

                <button type="submit" class="submit-btn">Add Student</button>

            </form>
        </section>

        <section class="students-section">
            <div class="students-header">
                <h2>Students</h2>
                <div id="studentCount">Total Students: 0</div>
            </div>

            <div id="studentContainer" class="student-container"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
