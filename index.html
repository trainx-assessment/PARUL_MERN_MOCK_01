<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Application Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
  </header>

  <main>
    <!-- Registration Form -->
    <section>
      <form id="studentForm">
        <label>Name: <input type="text" id="name" required></label>
        <label>Email: <input type="email" id="email" required></label>
        <label>Phone: <input type="text" id="phone" required></label>
        <label>DOB: <input type="date" id="dob" required></label>

        <fieldset>
          <legend>Gender</legend>
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </fieldset>

        <label>Course:
          <select id="course">
            <option>Select Course</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
          </select>
        </label>

        <fieldset>
          <legend>Skills</legend>
          <label><input type="checkbox" value="HTML"> HTML</label>
          <label><input type="checkbox" value="CSS"> CSS</label>
          <label><input type="checkbox" value="JavaScript"> JavaScript</label>
          <label><input type="checkbox" value="Git"> Git</label>
          <label><input type="checkbox" value="React"> React</label>
          <label><input type="checkbox" value="Node.js"> Node.js</label>
        </fieldset>

        <label>About:
          <textarea id="about" maxlength="200"></textarea>
          <small id="charCount">0 / 200</small>
        </label>

        <label>Photo: <input type="file" id="photo" accept="image/*"></label>

        <button type="submit" id="submitBtn">Register Student</button>
        <button type="reset">Reset Form</button>
      </form>
    </section>

    <!-- Statistics -->
    <section id="statistics">
      <h2>Statistics</h2>
      <p>Total Students: <span id="totalCount">0</span></p>
      <ul id="courseStats"></ul>
    </section>

    <!-- Search & Filter -->
    <section>
      <input type="text" id="searchInput" placeholder="Search student by name...">
      <select id="filterCourse">
        <option>All Courses</option>
        <option>Web Development</option>
        <option>UI/UX</option>
        <option>Python</option>
        <option>Data Analytics</option>
        <option>MERN Stack</option>
        <option>Cloud Computing</option>
      </select>
    </section>

    <!-- Student Cards -->
    <section id="studentContainer"></section>
  </main>

  <footer>
    <p>&copy; 2026 Student Management</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
