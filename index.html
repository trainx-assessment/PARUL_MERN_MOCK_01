<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCK_TEST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Student Application Management System</h1>
        <h4>Register and manage student applications</h4>
    </header>
    
    <main>
        <form action="">
            <div class="first-row">
                <label for="student-name" class="student-name"><b>Student Name</b></label>
                <input type="text" id="student-name" name="studentName" required>
        
                <label for="email" class="email"><b>Email</b></label>
                <input type="email" id="email" name="email" required>
            </div>
    
            <div class="second-row">
                <label for="phone-number" class="phone-number"><b>Phone Number</b></label>
                <input type="text" id="phone-number name="phoneNumber" required>
        
                <label for="date-of-birth" class="date-of-birth"><b>Date of Birth</b></label>
                <input type="date" id="date-of-birth" name="dateOfBirth" required>
            </div>
    
            <div class="third-row">
                <label for="gender"><b>Gender</b></label>
                <input type="radio" id="male" name="genderOfPerson" value="Male" required>
                <label for="male">Male</label>
        
                <input type="radio" id="female" name="genderOfPerson" value="Female">
                <label for="female">Female</label>
        
                <input type="radio" id="other" name="genderOfPerson" value="Other">
                <label for="other">Other</label>
        
                <label for="course" class="course"><b>Course</b></label>
                <select id="course" name="courseOfperson" required>
                    <option value="" selected disabled>Select Course</option>
                    <option value="Web Development">Web Development</option>
                    <option value="UI/UX">UI/UX</option>
                    <option value="Python">Python</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                </select>
            </div>
    
            <div class="fourth-row">
                <label for="skills"><b>Skills</b></label>
                <input type="checkbox" id="html" name="skillsSet" value="HTML">
                <label for="html">HTML</label>
                
                <input type="checkbox" id="css" name="skillsSet" value="CSS">
                <label for="css">CSS</label>
                
                <input type="checkbox" id="javascript" name="skillsSet" value="JavaScript">
                <label for="javascript">JavaScript</label>
                
                <input type="checkbox" id="git" name="skillsSet" value="GIT">
                <label for="git">GIT</label>
                
                <input type="checkbox" id="react" name="skillsSet" value="REACT">
                <label for="react">REACT</label>
                
                <input type="checkbox" id="nodejs" name="skillsSet" value="Node.js">
                <label for="nodejs">Node.js</label>
            </div>
    
            <div class="fifth-row">
                <label for="student-details"><b>About Student</b></label>
                <textarea id="student-details" name="studentDetails" maxlength="200"></textarea>
                <small>Maximum 200 characters</small>
            </div>
            
            <div class="sixth-row">
                <label for="profile-photo"><b>Profile Photo</b></label>
                <input type="file" id="profile-photo" name="profilePhoto" value="image">
            </div>
    
            <div class="btn">
                <!-- <label for="buttons">Register Student</label> -->
                <button id="buttons">Register Student</button>
                
                <!-- <label for="buttons">Reset Form</label> -->
                <button id="buttons">Reset Form</button>
            </div>
        </form>
    </main>
    
    <section>

    </section>
    
    
    <footer>

    </footer>
    
    <script src="script.js"></script>
</body>
</html>
