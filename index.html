<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>
            <br>
            <hr>
        </header>
        <form class="form1" action="">
            <label for=""><b>Student Name :</b></label><br>
            <input type="text"><br>
            <label for=""><b>Email :</b></label><br>
            <input type="email"><br>
            <label for=""><b>Phone Number :</b></label><br>
            <input type="text"><br>
            <label for=""><b>Date Of Birth :</b></label><br>
            <input type="date"><br>
            <label><b>Gender :</b> <br>
            <input type="radio" name="gender" value="male"> Male
            </label><br>
            <label>
            <input type="radio" name="gender" value="female"> Female
            </label><br>
            <label>
            <input type="radio" name="gender" value="other"> Other
            </label><br>
            <label for=""><b>Course :</b></label><br>
            <input type=""><br>
            <label for=""><b>Select Course :</b></label><br>
            <select name="course" id="">
                
                <option value="">Web Development</option>
                <option value="">UI/UX</option>
                <option value="">Python</option>
                <option value="">Data Analytics</option>
                <option value="">MERN Stack</option>
                <option value="">Cloud Computing</option>
            </select><br>
            
            <label for=""><b>Skills :</b></label><br>
            <label for="">HTML
                <input type="checkbox"> ||
            </label>
            <label for="">CSS
                <input type="checkbox"> ||
            </label>
            <label for="">JAVA SCRIPT
                <input type="checkbox"> ||
            </label>
            <label for="">GIT
                <input type="checkbox"> ||
            </label>
            <label for="">REACT
                <input type="checkbox"> ||
            </label>
            <label for="">NODE.JS
                <input type="checkbox">
            </label><br>
            <label for=""><b>About Student</b></label><br>
            <textarea name="" id="about" maxlength="200" rows="5" cols="50" placeholder="write about the student : (max 200 character).."></textarea>
           <br>
           <label for="">Profile Photo </label><input type="file"><br>

           <button>Register Student </button>        <button>Reset Form</button>
        </form>
    </div>
<script src="script.js"></script>
</body>
</html>
