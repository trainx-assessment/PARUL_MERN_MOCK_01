<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="header">
        <h1 id="h1">Student Application Management System</h1>
        <h3 id="h3">Register and manage student applications</h3>
    </header>

    <main>
        <section class="details">
            <div class="box1">
                <label> Name : <input type="text" name="name" id="name" placeholder="Enter Your Name" required></label>
                <label> Email :<input type="email" name="email" id="email" placeholder="Enter Email abc@xyz.com" required> </label>
                <label> Number: <input type="text" name="number" id="number" placeholder="Enter Your Number" required> </label>
                <label> Date : <input type="date" name="date" id="date" required> </label><br><br>
            </div>
            
            <label class="radio-label">Gender: <input type="radio" name="gender" value="Other"> Male</label>
            <label class="radio-label"><input type="radio" name="gender" value="Other"> Female</label>
        <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
        
        <br><br><label> Enrolled Course</label>
        <select>
            <option>Select Course</option>
            <option>Web Development</option>
            <option>UI / UX</option>
            <option>Python</option>
            <option>Data Analysis</option> 
            <option>Mern Stack</option>
            <option>Cloud Computing</option>
        </select> <br><br>
        
        <label> Select Your Skills: </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="HTML"> HTML </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="css"> CSS </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="javascript"> JavaScript </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="git"> Git </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="react"> React </label>
        <label class="checkbox-label"> <input type="checkbox" name="skills" value="Node"> Node </label>
        <br><br>
    </section>
        
    <section class="sec2">
        <textarea placeholder="Maximum 200 Characters"></textarea> <br><br> 
        <input type="file" name="Profile-Pic" id="image" placeholder="Accept image files only" accept="Accept image files only">
    </section>

    <section class="sec3">
        <button type="submit">Register Student</button>
        <button type="submit">Reset Form</button>
    </section>


    </main>
    <section></section>
    <form></form>
    <footer></footer>





    <script src="script.js"></script>
</body>
</html>
