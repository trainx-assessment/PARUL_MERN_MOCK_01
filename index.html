<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container headBox">
        <div>
          <h1>Student Application Management System</h1>
          <p><i>Register and manage student applications</i></p>
        </div>
        <button id="modeBtn" class="btn2">Dark Mode</button>
      </div>
    </header>

    <div class="container">
      <div class="box formBox">
        <h2>Student Registration</h2>
        <form id="form">
          <div class="grp">
            <label>Student Name</label>
            <input type="text" id="stdName" />
            <small class="err" id="errstdName"></small>
          </div>

          <div class="grp">
            <label>Email</label>
            <input type="email" id="email" />
            <small class="err" id="erremail"></small>
          </div>

          <div class="grp">
            <label>Phone Number</label>
            <input type="text" id="phone" />
            <small class="err" id="errphone"></small>
          </div>

          <div class="grp">
            <label>Date of Birth</label>
            <input type="date" id="dob" />
            <small class="err" id="errdob"></small>
          </div>

          <div class="grp">
            <label>Gender</label>
            <div class="row">
              <label
                ><input type="radio" name="gender" value="Male" /> Male</label
              >
              <label
                ><input type="radio" name="gender" value="Female" />
                Female</label
              >
              <label
                ><input type="radio" name="gender" value="Other" /> Other</label
              >
            </div>
            <small class="err" id="errgender"></small>
          </div>

          <div class="grp">
            <label>Course</label>
            <select id="course">
              <option value="">Select Course</option>
              <option value="Web Development">Web Development</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Python">Python</option>
              <option value="Data Analytics">Data Analytics</option>
              <option value="MERN Stack">MERN Stack</option>
              <option value="Cloud Computing">Cloud Computing</option>
            </select>
            <small class="err" id="errcourse"></small>
          </div>

          <div class="grp">
            <label>Skills</label>
            <div class="row">
              <label
                ><input type="checkbox" name="skills" value="HTML" />
                HTML</label
              >
              <label
                ><input type="checkbox" name="skills" value="CSS" /> CSS</label
              >
              <label
                ><input type="checkbox" name="skills" value="JavaScript" />
                JS</label
              >
              <label
                ><input type="checkbox" name="skills" value="React" />
                React</label
              >
              <label
                ><input type="checkbox" name="skills" value="Node.js" />
                Node.js</label
              >
            </div>
            <small class="err" id="errskills"></small>
          </div>

          <div class="grp">
            <label>About Student</label>
            <textarea id="about" rows="2"></textarea>
            <div class="cnt"><span id="charCount">0</span> / 200</div>
            <small class="err" id="errabout"></small>
          </div>

          <div class="grp">
            <label>Profile Photo</label>
            <input type="file" id="pic" accept="image/*" />
            <img
              id="preview"
              src=""
              alt="preview"
              style="display: none; width: 100px; margin-top: 10px"
            />
            <small class="err" id="errpic"></small>
          </div>

          <div class="grp btnRow">
            <button type="submit" id="addBtn" class="btn1">
              Register Student
            </button>
            <button type="button" id="resetBtn" class="btn2">Reset Form</button>
          </div>
        </form>
      </div>

      <div class="box statsBox">
        <h2>Course Statistics</h2>
        <div class="statGrid">
          <div class="stat">Total: <span id="cTotal">0</span></div>
          <div class="stat">Web Dev: <span id="cWeb">0</span></div>
          <div class="stat">UI/UX: <span id="cUi">0</span></div>
          <div class="stat">Python: <span id="cPy">0</span></div>
          <div class="stat">Data: <span id="cData">0</span></div>
          <div class="stat">MERN: <span id="cMern">0</span></div>
          <div class="stat">Cloud: <span id="cCloud">0</span></div>
        </div>
      </div>

      <div class="box searchBox">
        <h2>Search Students</h2>
        <div class="searchRow">
          <input
            type="text"
            id="search"
            placeholder="Search student by name..."
          />
          <select id="filter">
            <option value="All Courses">All Courses</option>
            <option value="Web Development">Web Development</option>
            <option value="UI/UX">UI/UX</option>
            <option value="Python">Python</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="MERN Stack">MERN Stack</option>
            <option value="Cloud Computing">Cloud Computing</option>
          </select>
        </div>
      </div>

      <div class="box listBox">
        <h2>Registered Students <span id="listCount"></span></h2>
        <div id="list" class="grid"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
