<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 margin-bottom="8px">Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        <section>
        <form id="studentForm" novalidate>
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input type="text" id="studentName" maxlength="40" placeholder="Student Name">
                    <small id="nameError" class="error"></small>
                </div>
                <div class="form-group">
                    <label>Student Email:</label>
                    <input type="email" id="email" placeholder="Student Email">
                    <small id="emailError" class="error"></small>
                </div>
                <div class="form-group">
                    <label>Student Number:</label>
                    <input type="text" id="phone" maxlength="10" placeholder="Student Number">
                    <small id="phoneError" class="error"></small>
                </div>
                <div class="form-group">
                    <label>Student DOB: </label>
                    <input type="date" id="dob">
                    <small id="dobError" class="error"></small>
                </div>
                <div class="form-group">
                    <label>Gender:</label>
                    <div class="inline-options">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                    <small id="genderError" class="error"></small>
                </div>
                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option>Web Development</option>
                        <option>UI/UX</option>
                        <option>Python</option>
                        <option>Data Analytics</option>
                        <option>MERN Stack</option>
                        <option>Cloud Computing</option>
                    </select>
                    <small id="courseError" class="error"></small>
                </div>
                <div class="form-group full-width">
                    <label>Skills:</label>
                    <div class="inline-options">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="React">
                            React
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="Node.js">
                            Node.js
                        </label>
                    </div>
                    <small id="skillsError" class="error"></small>
                </div>
                <div class="form-group full-width">
                    <label for="about">About Student:</label>
                    <textarea
                        id="about"
                        maxlength="200"
                        rows="5">
                    </textarea>
                    <div class="counter">
                        <span id="charCount">0</span> / 200
                    </div>
                    <small id="aboutError" class="error"></small>

                </div>
                <div class="form-group full-width">
                    <label for="photo">Profile Photo: </label>
                    <input
                        type="file"
                        id="photo"
                        accept=".jpg,.jpeg,.png">

                    <small id="photoError" class="error"></small>

                    <img id="photoPreview" class="preview" alt="Photo Preview" >
                </div>
            </div>
            <div class="buttons">
                <button type="submit" id="submitBtn">
                    Register Student
                </button>
                <button type="reset" class="secondary">
                    Reset Form
                </button>
            </div>
        </form>
    </section>
    <section>

        <h2>Student Statistics</h2>

        <div id="statistics" class="stats-grid"></div>

    </section>
    <section>

        <h2>Search & Filter</h2>

        <div class="search-grid">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name...">

            <select id="filterCourse">

                <option value="">All Courses</option>

                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>

            </select>

        </div>

    </section>
    <section>

        <h2>Student Applications</h2>

        <div id="studentContainer" class="student-container"></div>

        <p id="noStudents" class="empty-message">
            No students found
        </p>

    </section>

</main>
<footer>
    <p>Student Application Management System</p>
</footer>
    <script src="script.js"></script>
