<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <section id="registration-section">
    <h2>Student Registration</h2>

    <form id="studentForm">

        <div>
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" name="studentName" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>
        </div>

        <div>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div>
            <label>Gender</label>

            <label>
                <input type="radio" name="gender" value="Male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="Female">
                Female
            </label>

            <label>
                <input type="radio" name="gender" value="Other">
                Other
            </label>
        </div>

        <div>
            <label for="course">Course</label>

            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </div>

        <div>
            <label>Skills</label>

            <label>
                <input type="checkbox" name="skills" value="HTML">
                HTML
            </label>

            <label>
                <input type="checkbox" name="skills" value="CSS">
                CSS
            </label>

            <label>
                <input type="checkbox" name="skills" value="JavaScript">
                JavaScript
            </label>

            <label>
                <input type="checkbox" name="skills" value="Git">
                Git
            </label>

            <label>
                <input type="checkbox" name="skills" value="React">
                React
            </label>

            <label>
                <input type="checkbox" name="skills" value="Node.js">
                Node.js
            </label>
        </div>

        <div>
            <label for="about">About Student</label>
            <textarea
            id="about"
            name="about"
            maxlength="200"
            minlength="5"
            placeholder="Maximum 200 characters"
            ></textarea>
            <span id="aboutCounter" style="size: 1px;">0/200</span>
        </div>

        <div>
            <label for="profilePhoto">Profile Photo</label>
            <input
                type="file"
                id="profilePhoto"
                name="profilePhoto"
                accept="image/*"
            >
        </div>

        <div>
            <button type="submit">Register Student</button>
            <button type="reset">Reset Form</button>
        </div>

    </form>
</section>

<main>

        <!-- <section id="registration-section">
            <h2>Student Registration</h2>
            <form id="studentForm">
            </form>
        </section> -->

        <section id="statistics-section">
            <h2>Student Statistics</h2>
            <div id="statistics">
                <p>Total Students: <span id="totalStudents"></span></p>
            </div>
        </section>

        <section id="search-filter-section">
            <h2>Search & Filter Students</h2>

            <div class="search-filter">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search student by name..."
                >

                <select id="courseFilter">
                    <option value="">All Courses</option>
                    <option value="Web Development">Web Development</option>
                    <option value="UI/UX">UI/UX</option>
                    <option value="Python">Python</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                </select>
            </div>
        </section>

        <section id="students-section">
            <h2>Student Card Container</h2>
            <div id="studentContainer"></div>
        </section>

    </main>
 <footer>
        <p>Student Application Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
