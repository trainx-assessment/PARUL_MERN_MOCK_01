<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Application Management System</title>
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <!--Student Registration-->
        <section>
            <h2>Student Registration</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" required >
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div>
                        <label><input type="radio" name="gender" value="Male">Male</label>
                        <label><input type="radio" name="gender" value="Female">Female</label>
                        <label><input type="radio" name="gender" value="Other">Other</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
                <div class="form-group">
                <label>Skills</label>

                <div>
                    <label><input type="checkbox" name="skills" value="HTML">HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS">CSS</label>
                    <label><input type="checkbox" name="skills" value="JavaScript">JavaScript</label>
                    <label><input type="checkbox" name="skills" value="Git">Git</label>
                    <label><input type="checkbox" name="skills" value="React">React</label>
                    <label><input type="checkbox" name="skills" value="Node.js">Node.js</label>
                </div>
            </div>
            <div class="form-group full-row">
                <label for="about">About Student</label>
                <textarea id="about" name="about" maxlength="200" placeholder="Maximum 200 characters"></textarea>
                <small id="charCount">0/200</small>
            </div>
            <div class="form-group full-row">
                <label for="photo">Profile Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>
            <div class="form-buttons">
                <button type="submit" id="submitButton">Register Student</button>
                <button type="reset">Reset Form</button>
            </div> 
            </form>
        </section>
        <!--Student Statistics-->
        <section>
            <h2>Student Statistics</h2>
            <div id="statistics">
                <!--Statistics-->
            </div>
        </section>
        <!-- Search and Filter -->
            <section>
                <h2>Search & Filter</h2>

                <div>
                    <input type="text" id="searchInput" placeholder="Search student by name">

                    <select id="courseFilter">
                        <option value="">All Courses</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
            </section>
        <section>
            <h2>Students</h2>
            <div id="studentContainer">
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
