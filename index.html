<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>

          
        </div>
    </header>


    <main class="container">

        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm" novalidate>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="studentName">Student Name</label>

                        <input
                            type="text"
                            id="studentName"
                            name="studentName"
                            placeholder="Enter student name"
                            maxlength="40"
                        >

                        <small class="error-message" id="studentNameError"></small>
                    </div>


                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email"
                        >

                        <small class="error-message" id="emailError"></small>
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10-digit phone number"
                            maxlength="10"
                        >

                        <small class="error-message" id="phoneError"></small>
                    </div>


                    <div class="form-group">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                        >

                        <small class="error-message" id="dobError"></small>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <div class="radio-group">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                >
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                >
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                >
                                Other
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
