<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>
        </div>
    </header>
    <main class="container">
        <section>
            <h2>Student Registration</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Enter student name">
                    <small class="error" id="studentNameError"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address">
                    <small class="error" id="emailError"></small>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="Enter phone number">
                    <small class="error" id="phoneError"></small>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                    <small class="error" id="dobError"></small>
                </div>
                <fieldset class="form-group">
                    <legend>Gender</legend>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male">Male</label>
                        <label><input type="radio" name="gender" value="Female">Female</label>
                        <label><input type="radio" name="gender" value="Other">Other</label>
                    </div>
                    <small class="error" id="genderError"></small>
                </fieldset>
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                    <small class="error" id="courseError"></small>
                </div>
                <fieldset class="form-group full-width">
                    <legend>Skills</legend>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="HTML">HTML</label>
                        <label><input type="checkbox" name="skills" value="CSS">CSS</label>
                        <label><input type="checkbox" name="skills" value="JavaScript">JavaScript</label>
                        <label><input type="checkbox" name="skills" value="Git">Git</label>
                        <label><input type="checkbox" name="skills" value="React">React</label>
                        <label><input type="checkbox" name="skills" value="Node.js">Node.js</label>
                    </div>
                    <small class="error" id="skillsError"></small>
                </fieldset>
                <div class="form-group full-width">
                    <label for="about">About Student <span class="character-limit">(Maximum 200
                            characters)</span></label>
                    <textarea id="about" name="about" rows="5" maxlength="200"
                        placeholder="Write something about yourself..."></textarea>
                    <small id="characterCount">0 / 200 characters</small>
                    <small class="error" id="aboutError"></small>
                </div>
                <div class="form-group full-width">
                    <label for="profilePhoto">Profile Photo</label>
                    <p class="image-para">Accept .jpg, .jpeg and .png files only.</p>
                    <input type="file" id="profilePhoto" name="profilePhoto"
                        accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                    <small class="error" id="profilePhotoError"></small>
                </div>
                <div class="button-group full-width">
                    <button type="submit" class="btn btn-primary">Register Student</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>Student Management System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
