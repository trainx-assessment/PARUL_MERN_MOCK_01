<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-3"></span>
        <span class="shape shape-4"></span>
    </div>

    <nav>
        <header>Student Application Management System</header>
        <p><span>Register and manage student applications</span></p>
        <button type="button" id="themeBtn">Dark Mode</button>
    </nav>


    <main>
        <form action="/" method="POST" id="regForm" novalidate>

            <div class="row">
                <label for="name">Name<span class="req">*</span></label>

                <input type="text" id="name" name="name" required>


                <span class="msg" id="nameMsg"></span>
            </div>



            <div class="row">
                <label for="email">Email ID<span class="req">*</span></label>
                <input type="email" id="email" name="email" required>




                <span class="msg" id="emailMsg"></span>
            </div>

            <div class="row">

                
                <label for="phone">Phone Number<span class="req">*</span></label>
                <input type="text" id="phone" name="phone" required>

                
                <span class="msg" id="phoneMsg"></span>


            </div>

            <div class="row">

                
                <label for="dob">Date of Birth<span class="req">*</span></label>
                <input type="date" id="dob" name="dob" required>


                <span class="msg" id="dobMsg"></span>
            </div>

            <div class="row full">
                <label>Gender<span class="req">*</span></label>
                <div class="options">
                    <span class="option">
                        <input type="radio" id="male" name="gender" value="Male" required>
                        <label for="male">Male</label>
                    </span>
                    <span class="option">


                        <input type="radio" id="female" name="gender" value="Female" required>
                        <label for="female">Female</label>
                    </span>
                    <span class="option">


                        <input type="radio" id="other" name="gender" value="Other" required>
                        <label for="other">Other</label>
                    </span>
                </div>
                <span class="msg" id="genderMsg"></span>
            </div>

            <div class="row">

                
                <label for="course">Course<span class="req">*</span></label>
                <select name="course" id="course" required>
                    <option value="select" id="default" disabled selected>Select Your Course</option>
                    
                    <option value="web-dev">Web Development</option>
                    
                    <option value="uiux">UI/UX</option>
                    <option value="python">Python</option>
                    <option value="data-ana">Data Analytics</option>
                    <option value="mern">MERN Stack</option>
                    <option value="cloud">Cloud Computing</option>
                </select>
                <span class="msg" id="courseMsg"></span>
            </div>

            <div class="row full">
                <label>Skills<span class="req">*</span></label>
                <div class="options">
                    <span class="option">


                        <input type="checkbox" id="html" name="skills" value="HTML">
                        <label for="html">HTML</label>

                    </span>
                    <span class="option">
                    
                        <input type="checkbox" id="css" name="skills" value="CSS">
                        <label for="css">CSS</label>
                    
                    </span>
                    <span class="option">
                    
                        <input type="checkbox" id="js" name="skills" value="JavaScript">
                        <label for="js">JavaScript</label>
                    
                    </span>
                    <span class="option">
                        <input type="checkbox" id="git" name="skills" value="Git">
                    
                        <label for="git">Git</label>
                        
                    
                    </span>
                    <span class="option">
                    
                        
                        
                        <input type="checkbox" id="react" name="skills" value="React">
                        <label for="react">React</label>
                    
                    </span>
                    <span class="option">
                        
                        
                        <input type="checkbox" id="node" name="skills" value="Node.js">
                        <label for="node">Node.js</label>
                    </span>
                </div>
                <span class="msg" id="skillsMsg"></span>
            </div>

            <div class="row full">
                <label for="about">About Student<span class="req">*</span></label>
                <textarea name="about" id="about" maxlength="200" placeholder="Maximum 200 characters" required></textarea>
                <span class="counter" id="aboutCount">0 / 200</span>
                <span class="msg" id="aboutMsg"></span>
            </div>

            <div class="row full">


                <label for="photo">Profile Photo<span class="req">*</span></label>
                
                
                <input type="file" accept="image/*" name="photo" id="photo" required>

                <span class="msg" id="photoMsg"></span>
            </div>

            <div class="row full buttons">
                <button type="submit" id="submitBtn">Register Student</button>

                <button type="reset" id="resetBtn">Reset Form</button>
            </div>

        </form>

        <section class="stats-area">
            <h2>Student Statistics</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Total Students</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat-box">

                    
                    <span class="stat-label">Web Development</span>
                    <span class="stat-value" id="webDevCount">0</span>
                </div>
                <div class="stat-box">

                    <span class="stat-label">UI/UX</span>
                    <span class="stat-value" id="uiuxCount">0</span>
                </div>
                <div class="stat-box">

                    <span class="stat-label">Python</span>
                    <span class="stat-value" id="pythonCount">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Data Analytics</span>
                    <span class="stat-value" id="dataAnaCount">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">MERN Stack</span>
                    <span class="stat-value" id="mernCount">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Cloud Computing</span>
                    <span class="stat-value" id="cloudCount">0</span>
                </div>
            </div>
        </section>

        <section class="search-area">
            
            
            <input type="text" id="searchBox" placeholder="Search student by name...">
            <select id="filterBox">
                <option value="">All Courses</option>

                
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>

                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </section>

        <section class="cards-area">
            <h2>Registered Students</h2>
            <div id="cardsBox" class="cards"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Application Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
