<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
    <small>Created by Om Rai</small>
</header>

<main>
    <section class="form-box">
        <h2>Student Registration</h2>

        <form id="studentForm">
            <div class="grid">
                <div>
                    <label>Student Name</label>
                    <input type="text" id="name">
                    <span id="nameError"></span>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email">
                    <span id="emailError"></span>
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="text" id="phone">
                    <span id="phoneError"></span>
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                    <span id="dobError"></span>
                </div>

                <div>
                    <label>Gender</label>
                    <div class="options">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <span id="genderError"></span>
                </div>

                <div>
                    <label>Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option>Web Development</option>
                        <option>UI/UX</option>
                        <option>Python</option>
                        <option>Data Analytics</option>
                        <option>MERN Stack</option>
                        <option>Cloud Computing</option>
                    </select>
                    <span id="courseError"></span>
                </div>
            </div>

            <label>Skills</label>
            <div class="options">
                <label><input type="checkbox" name="skill" value="HTML"> HTML</label>
                <label><input type="checkbox" name="skill" value="CSS"> CSS</label>
                <label><input type="checkbox" name="skill" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="skill" value="Git"> Git</label>
                <label><input type="checkbox" name="skill" value="React"> React</label>
                <label><input type="checkbox" name="skill" value="Node.js"> Node.js</label>
            </div>
            <span id="skillsError"></span>

            <label>About Student</label>
            <textarea id="about" maxlength="200"></textarea>
            <div id="counter">0 / 200</div>
            <span id="aboutError"></span>

            <label>Profile Photo</label>
            <input type="file" id="photo" accept="image/*">
            <span id="photoError"></span>

            <div class="buttons">
                <button type="submit" id="submitBtn">Register Student</button>
                <button type="button" id="resetBtn">Reset Form</button>
            </div>
        </form>
    </section>

    <section class="stats">
        <h2>Statistics</h2>
        <div id="stats"></div>
    </section>

    <section class="search">
        <input type="text" id="search" placeholder="Search student by name...">

        <select id="filter">
            <option value="">All Courses</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
        </select>

        <button id="themeBtn">Dark Mode</button>
    </section>

    <section>
        <div id="studentContainer" class="cards"></div>
    </section>
</main>

<footer>
    <p>Student Application System - Om Rai</p>
</footer>

<script src="script.js"></script>
</body>
</html>
