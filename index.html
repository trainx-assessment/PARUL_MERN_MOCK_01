<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="header">
        <h1>Student Application Management System</h1>
        <h3>Register and manage student applications</h3>
    </header>

    <main>

        
            <form action="submit" class="student-form">
                <div>
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Student Name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Student Email" required>
                </div>
                <div>
                    <label for="phoneNumber">Phone Number</label>
                    <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" required>
                </div>
                <div>
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                </div>
                <div class="choice-group">
                    <h4>Gender</h4>
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>
                <div>
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="" selected disabled>Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
                <div class="choice-group skills-group">
                    <h4>Skills</h4>
                    <label>
                        <input type="checkbox" name="skills" value="HTML">
                        HTML
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="CSS">
                        CSS
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="JavaScript">
                        JavaScript
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="Git">
                        Git
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="React">
                        React
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="Node.js">
                        Node.js
                    </label>
                </div>
                <div class="full-width">
                    <label for="aboutStudent">About Student</label>
                    <textarea id="aboutStudent" name="aboutStudent" placeholder="About the student" maxlength="200" rows="4" required></textarea>
                    <small>Maximum 200 characters</small>
                </div>
                <div class="full-width">
                    <label for="profilePhoto">Profile Photo</label>
                    <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*">
                </div>
                <div class="form-actions">
                    <button type="submit">Register Student</button>
                    <button type="reset">Reset Form</button>
                </div>
        </form>


        <div class="register-card">
            <h1>Registered Students</h1>
            <section id="student-cards"></section>
        </div>
        
        
        <section class="statistics">
            <h2>Student Statistics</h2>
            <p>Total Students: <span id="total-students">0</span></p>
            <p>Web Development: <span id="web-development-count">0</span></p>
            <p>UI/UX: <span id="ui-ux-count">0</span></p>
            <p>Python: <span id="python-count">0</span></p>
            <p>Data Analytics: <span id="data-analytics-count">0</span></p>
            <p>MERN Stack: <span id="mern-stack-count">0</span></p>
            <p>Cloud Computing: <span id="cloud-computing-count">0</span></p>
        </section>
        
    </main>


    <script src="script.js"></script>
</body>
</html>
