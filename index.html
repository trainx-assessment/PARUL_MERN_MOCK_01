<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Application Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>Student Management System</h1>
    <p>Register and manage student application</p>
  </div>

  <div id="registration-form">
    <form id="studentForm">
      <div>
        <label for="name">Student Name</label>
        <input type="text" id="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" required>
      </div>
      <div>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>
      </div>
      <div>
        <label>Gender</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Mental Illness
      </div>
      <div>
        <label for="course">Course</label>
        <select id="course">
          <option>Select Course</option>
          <option>Web Development</option>
          <option>UI/UX</option>
          <option>Python</option>
          <option>Data Analytics</option>
          <option>MERN Stack</option>
          <option>Cloud Computing</option>
        </select>
      </div>
      <div>
        <label>Skills</label>
        <input type="checkbox" value="HTML"> HTML
        <input type="checkbox" value="CSS"> CSS
        <input type="checkbox" value="JavaScript"> JavaScript
        <input type="checkbox" value="Git"> Git
        <input type="checkbox" value="React"> React
        <input type="checkbox" value="Node.js"> Node.js
      </div>
      <div>
        <label for="about">About Student</label>
        <textarea id="about"></textarea>
      </div>
      <div>
        <label for="photo">Profile Photo</label>
        <input type="file" id="photo" accept="image/*">
      </div>
      <div>
        <button type="submit">Register Student</button>
        <button type="reset">Reset Form</button>
      </div>
    </form>
  </div>

  <div id="statistics">
    <h3>Total Students</h3>
    <p>Web Development: 0</p>
    <p>UI/UX: 0</p>
    <p>Python: 0</p>
    <p>Data Analytics: 0</p>
    <p>MERN Stack: 0</p>
    <p>Cloud Computing: 0</p>
  </div>

  <div id="search-filter">
    <h3>Search and Filter</h3>
    <input type="text" id="search" placeholder="Search student Name ">
    <select id="filterCourse">
      <option>All Courses</option>
      <option>Web Development</option>
      <option>UI/UX</option>
      <option>Python</option>
      <option>Data Analytics</option>
      <option>MERN Stack</option>
      <option>Cloud Computing</option>
    </select>
  </div>

  <div id="studentCards"> </div>
  <script src="script.js"></script>
</body>
</html>
