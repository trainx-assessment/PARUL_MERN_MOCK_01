<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header"> 
        <div class="header-content"> 
            <h1>Student Application Management System</h1>  
        </div> 
    </header> 
    <main class="container"> 
        <section class="form-section"> 
            <form id="studentForm"> 
                <div class="form-grid full-width"> 
                    <div class="form-group"> 
                        <label for="studentName">Student Name</label> 
                        <input type="text" id="studentName" placeholder="Enter student name"> 
                    </div>
                    <div class="form-group full-width"> 
                        <label for="email">Email</label> 
                        <input type="email" id="email" placeholder="example@gmail.com"> 
                    </div> 
                    <div class="form-group full-width"> 
                        <label for="phone">Phone Number</label> 
                        <input type="text" id="phone" placeholder="phone no"> 
                    </div> 
                    <div class="form-group"> 
                        <label for="dob">Date of Birth</label> 
                        <input type="date" id="dob"> 
                    </div>
                    <div class="form-group"> 
                        <label>Gender</label> 
                        <div class="radio-group"> <label> 
                            <input type="radio" name="gender" value="Male">Male</label> 
                            <label> <input type="radio" name="gender" value="Female" > Female </label> 
                            <label> <input type="radio" name="gender" value="Other" > Other </label> 
                        </div> 
                    </div> 
                    <div class="form-group"> 
                        <label for="course">Course</label> 
                        <select id="course"> 
                            <option value="">Select Course</option> 
                            <option value="Web Development">Web Development</option> 
                            <option value="UI/UX">UI/UX</option> 
                            <option value="Python">Python</option> 
                            <option value="Data Analytics">Data Analytics</option> 
                            <option value="MERN Stack">MERN Stack</option> 
                            <option value="Cloud Computing">Cloud Computing</option> 
                        </select>
                    </div>
                </div>
                <div class="form-group"> 
                    <label>Skill</label> 
                    <div class="checkbox-group"> <label> 
                        <input type="checkbox" name="skills" value="HTML" > HTML </label> 
                        <label><input type="checkbox" name="skills" value="CSS" > CSS </label> 
                        <label><input type="checkbox" name="skills" value="JavaScript" > JavaScript </label> 
                        <label><input type="checkbox" name="skills" value="Git" > Git </label> 
                        <label><input type="checkbox" name="skills" value="React" > React </label> 
                        <label><input type="checkbox" name="skills" value="Node.js" > Node.js </label> 
                    </div>
                </div> 
                <div class="form-group full-width"> 
                    <label for="about">About Student</label> 
                    <textarea id="about" rows="5" placeholder="Write something" ></textarea> 
                </div> 
                <div class="form-group full-width"> 
                    <label for="photo">Profile Photo</label> 
                    <input type="file" id="photo"> 
                </div> 
                <div class="form-buttons"> 
                    <button type="submit" id="submitBtn" class="btn">Register</button> 
                </div> 
            </form> 
        </section> 
        <footer class="footer"> 
            <p>Student management webpages</p> 
        </footer>
    <script src="script.js"></script>
</body>
</html>
