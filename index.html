<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>

    <main>
      <section class="form-section">
        <h2>Student Registration</h2>

        <form id="studentForm" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="studentName">Student Name</label>
              <input type="text" id="studentName" />
              <small class="error"></small>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" />
              <small class="error"></small>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" />
              <small class="error"></small>
            </div>

            <div class="form-group">
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" />
              <small class="error"></small>
            </div>

            <div class="form-group">
              <label>Gender</label>

              <div class="radio-group">
                <label
                  ><input type="radio" name="gender" value="Male" /> Male</label
                >
                <label
                  ><input type="radio" name="gender" value="Female" />
                  Female</label
                >
                <label
                  ><input type="radio" name="gender" value="Other" />
                  Other</label
                >
              </div>

              <small class="error"></small>
            </div>

            <div class="form-group">
              <label for="course">Course</label>

              <select id="course">
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
              </select>

              <small class="error"></small>
            </div>

            <div class="form-group full-width">
              <label>Skills</label>

              <div class="checkbox-group">
                <label><input type="checkbox" value="HTML" /> HTML</label>
                <label><input type="checkbox" value="CSS" /> CSS</label>
                <label
                  ><input type="checkbox" value="JavaScript" />
                  JavaScript</label
                >
                <label><input type="checkbox" value="Git" /> Git</label>
                <label><input type="checkbox" value="React" /> React</label>
                <label><input type="checkbox" value="Node.js" /> Node.js</label>
              </div>

              <small class="error"></small>
            </div>

            <div class="form-group full-width">
              <label for="about">About Student</label>

              <textarea id="about" maxlength="200" rows="5"></textarea>

              <div class="counter"><span id="charCount">0</span> / 200</div>

              <small class="error"></small>
            </div>

            <div class="form-group full-width">
              <label for="photo">Profile Photo</label>

              <input type="file" id="photo" accept="image/*" />

              <small class="error"></small>
            </div>
          </div>

          <div class="buttons">
            <button type="submit" class="primary">Register Student</button>

            <button type="reset" class="secondary">Reset Form</button>
          </div>
        </form>
      </section>

    <script src="script1.js"></script>
  </body>
</html>
