<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>

        <!-- Student Registration Form -->
        <section id="registration-section">
            <h2>Student Registration</h2>

            <form id="student-form">

                <!-- Form fields will be added according to later tasks -->

            </form>
        </section>

        <!-- Student Statistics -->
        <section id="statistics-section">
            <h2>Student Statistics</h2>

            <div id="student-statistics">
                <!-- Statistics will be displayed here -->
            </div>
        </section>

        <!-- Search and Filter -->
        <section id="search-section">
            <h2>Search and Filter Students</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Search students..."
            >

            <select id="status-filter">
                <option value="all">All Students</option>
            </select>
        </section>

        <!-- Student Cards -->
        <section id="students-section">
            <h2>Student Applications</h2>

            <div id="student-cards-container">
                <!-- Student cards will be added using JavaScript -->
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Application Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
