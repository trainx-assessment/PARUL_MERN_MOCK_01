<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>


    <main>

        <section class="form-section">
            <h2>Student Registration</h2>
            <form id="stForm"> 

                <div class="form-grid">
                    <div class="form-grp">
                        <label for="stName">Student Name</label>
                        <input type="text" id="stName" name="stName" placeholder="Enter student name">
                        <span class="error-message" id="nameError"></span>
                    </div>

                    <div class="form-grp">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter email address">
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-grp">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Enter phone number">
                        <span class="error-message" id="phoneError"></span>
                    </div>

                    <div class="form-grp">
                        <label for="dob">DOB </label>
                        <input type="date" id="dob" name="dob">
                        <span class="error-message" id="dobError"></span>
                    </div>

                    <div class="form-grp">
                        <label>Gender</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="gender" value="Male"> Male
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="Female"> Female
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="Other"> Other
                            </label>
                        </div>
                        <span class="error-message" id="genderError"></span>
                    </div>

                    <div class="form-grp">
                        <label for="course">Course</label>
                        <select id="course" name="course">
                            <option value="">Select Course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Python">Python</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="MERN Stack">MERN Stack</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                        </select>
                        <span class="error-message" id="courseError"></span>
                    </div>

                    <div class="form-grp full-width">
                        <label>Skills</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="HTML"> HTML
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="CSS"> CSS
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="Git"> Git
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="React"> React
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="skills" value="Node.js"> Node.js
                            </label>
                        </div>
                        <span class="error-message" id="skillsError"></span>
                    </div>

                    <div class="form-grp full-width">
                        <label for="about">About Student</label>
                        <textarea id="about" name="about" maxlength="200" rows="4" placeholder="Tell us about student.."></textarea>
                        <div class="char-counter"><span id="charCount">0</span> / 200</div>
                        <span class="error-message" id="aboutError"></span>
                    </div>

                    <div class="form-grp full-width">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" name="photo" accept="image/*">
                        <span class="error-message" id="photoError"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="button" id="resetBtn">Reset Form</button>
                </div>

            </form>
        </section>

        <section class="stats-section">
            <h2>Student Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <span>Total Students: <strong id="totalStudents">0</strong></span>
                </div>
                <div class="stat-card"><span>Web Development: <strong id="statWebDev">0</strong></span></div>
                <div class="stat-card"><span>UI/UX: <strong id="statUIUX">0</strong></span></div>
                <div class="stat-card"><span>Python: <strong id="statPython">0</strong></span></div>
                <div class="stat-card"><span>Data Analytics: <strong id="statDataAnalytics">0</strong></span></div>
                <div class="stat-card"><span>MERN Stack: <strong id="statMERN">0</strong></span></div>
                <div class="stat-card"><span>Cloud Computing: <strong id="statCloud">0</strong></span></div>
            </div>
        </section>


        <section class="searchSection">
            <div class="searchgrid">
                <div class="form-group">
                    <input type="text" id="searchInput" placeholder="Search student by name..">
                </div>
                <div class="form-group">
                    <select id="courseFilter">
                        <option value="All Courses">All Courses</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="cards-section">
            <div id="studentContainer"></div>
            <p id="noStudentsMsg" class="no-students">No students found</p>
        </section>

    </main>

  

    <script src="script.js"></script>

</body>
</html>
