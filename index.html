<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Management System</title>
</head>

<body>

    <!-- 1. Header -->
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
            
        <section id="registration">
            <h2>Student Registration Form</h2>
            <form>
                <div class="studentName">
                    <label for="studentName">Student Name:</label>
                    <input type="text" id="studentName" name="studentName" required>
                </div>
            
                <div class="email">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
            
                <div class="phone">
                    <label for="phone">Phone Number:</label>
                    <input
                        type="text" id="phone" name="phone" required>
                </div>
            
                <div class="dob">
                    <label for="dob">Date of Birth:</label>
                    <input
                        type="date" id="dob" name="dob" required>
                </div>
            
                <fieldset class="gender">
                    <legend>Gender:</legend>
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>
                
                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                
                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </fieldset>
            
                <div class="course">
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="web-development">Web Development</option>
                        <option value="ui-ux">UI/UX</option>
                        <option value="python">Python</option>
                        <option value="data-analytics">Data Analytics</option>
                        <option value="mern-stack">MERN Stack</option>
                        <option value="cloud-computing">Cloud Computing</option>
                    </select>
                </div>

                <fieldset class="skills">
                    <legend>Skills:</legend>
                
                    <label>
                        <input type="checkbox" name="skills" value="html">
                        HTML
                    </label>
                
                    <label>
                        <input type="checkbox" name="skills" value="css">
                        CSS
                    </label>
                
                    <label>
                        <input type="checkbox" name="skills" value="javascript">
                        JavaScript
                    </label>
                
                    <label>
                        <input type="checkbox" name="skills" value="git">
                        Git
                    </label>
                
                    <label>
                        <input type="checkbox" name="skills" value="react">
                        React
                    </label>
                
                    <label>
                        <input type="checkbox" name="skills" value="nodejs">
                        Node.js
                    </label>
                </fieldset>
            
                <div class="about">
                    <label for="about">About Student:</label>
                    <textarea
                        id="about"
                        name="about"
                        maxlength="200"
                        placeholder="Maximum 200 characters"
                    ></textarea>
                
                    <small>Maximum 200 characters</small>
                </div>
            
                <div class="pfp">
                    <label for="profilePhoto">Profile Photo:</label>
                    <input
                        type="file" id="profilePhoto" name="profilePhoto"accept="image/*">
                </div>
            
                <div class="button">
                    <button type="submit">Register Student</button>
                    <button type="reset">Reset Form</button>
                </div>
            
            </form>
        </section>

        <section id="student-statistics"></section>
        <section id="search-filter"></section>
        <section id="cards">
            <div class="card card1"></div>
            <div class="card card2"></div>
            <div class="card card3"></div>
        </section>
        <footer></footer>

    <script src="script.js"></script>

</body>
</html>
