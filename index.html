<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>

        <section class="form">
            <h2>Student Registration Form</h2>

            <form id="studentForm">

                
                <div class="form-group">
                    <label for="studentName">Student Name *</label>
                    <input type="text" id="studentName" name="studentName" required>
                </div>

                
                <div class="form-group">
                    <label for="studentEmail">Email *</label>
                    <input type="email" id="studentEmail" name="studentEmail" required>
                </div>

                <div class="form-group">
                    <label for="studentPhone">Phone Number *</label>
                    <input type="text" id="studentPhone" name="studentPhone" required>
                </div>

                
                <div class="form-group">
                    <label for="studentDob">Date of Birth *</label>
                    <input type="date" id="studentDob" name="studentDob" required>
                </div>

                
                <div class="form-group full-width">
                    <label>Gender *</label>
                    <div class="radio-group">
                        <input type="radio" id="genderMale" name="gender" value="Male" required>
                        <label for="genderMale">Male</label>

                        <input type="radio" id="genderFemale" name="gender" value="Female" required>
                        <label for="genderFemale">Female</label>

                        <input type="radio" id="genderOther" name="gender" value="Other" required>
                        <label for="genderOther">Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentCourse">Course *</label>
                    <select id="studentCourse" name="studentCourse" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>

                
                <div class="form-group full-width">
                    <label>Skills *</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="skillHtml" name="skills" value="HTML">
                        <label for="skillHtml">HTML</label>

                        <input type="checkbox" id="skillCss" name="skills" value="CSS">
                        <label for="skillCss">CSS</label>

                        <input type="checkbox" id="skillJs" name="skills" value="JavaScript">
                        <label for="skillJs">JavaScript</label>

                        <input type="checkbox" id="skillGit" name="skills" value="Git">
                        <label for="skillGit">Git</label>

                        <input type="checkbox" id="skillReact" name="skills" value="React">
                        <label for="skillReact">React</label>

                        <input type="checkbox" id="skillNode" name="skills" value="Node.js">
                        <label for="skillNode">Node.js</label>
                    </div>
                </div>

            
                <div class="form-group full-width">
                    <label for="studentAbout">About Student *</label>
                    <textarea id="studentAbout" name="studentAbout" maxlength="200" required></textarea>
                    <div class="character-counter">
                        <span id="counter">0 / 200</span>
                    </div>
                </div>

        
                <div class="form-group full-width">
                    <label for="studentPhoto">Profile Photo *</label>
                    <input type="file" id="studentPhoto" name="studentPhoto" accept="image/*" required>
                </div>

                <div class="form-buttons full-width">
                    <button type="submit" id="registerBtn">Register Student</button>
                    <button type="reset" id="resetBtn">Reset Form</button>
                </div>

            </form>
        </section>


        <section class="stat">
            <h2>Student Statistics</h2>
            <p>Total Students: 0</p>
        </section>

        <section class="filter">
            <h2>Search and Filter Section</h2>
        </section>

        <section class="cards">
            <h2>Student Cards Container</h2>
        </section>

    </main>

    
    <footer class="footer">
        <p> 2024 Student Application Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
