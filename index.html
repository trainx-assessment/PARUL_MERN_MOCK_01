<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
        <header class="header">
      <h1>Student Application Manager</h1>
      <p>Register and manage student applications</p>
      </header>

      <section class="form-section">
        <h2>Student Registration</h2>

        <form id="studentForm">
          <div class="form-group">
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter student name"/>
            <small class="error" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email"/>
            <small class="error" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10 digit phone"/>
            <small class="error" id="phoneError"></small>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" />
            <small class="error" id="dobError"></small>
          </div>

          <div class="form-group">
            <label>Gender</label>

            <div class="options">
              <label>
                <input type="radio" name="gender" value="Male" required />
                Male
              </label>

              <label>
                <input type="radio" name="gender" value="Female" />
                Female
              </label>

              <label>
                <input type="radio" name="gender" value="Other" />
                Other
              </label>
            </div>
            <small class="error" id="genderError"></small>
          </div>

          <div class="form-group">
            <label for="course">Course</label>

            <select id="course" required>
              <option value="">Select Course</option>
              <option value="Web Development">Web Development</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Python">Python</option>
              <option value="Data Analytics">Data Analytics</option>
            </select>
            <small class="error" id="courseError"></small>
          </div>

          <div class="form-group">
            <label>Skills</label>

            <div class="options">
              <label>
                <input type="checkbox" name="skills" value="HTML" />
                HTML
              </label>

              <label>
                <input type="checkbox" name="skills" value="CSS" />
                CSS
              </label>

              <label>
                <input type="checkbox" name="skills" value="JavaScript" />
                JavaScript
              </label>

              <label>
                <input type="checkbox" name="skills" value="Git" />
                Git
              </label>
            </div>
            <small class="error" id="skillsError"></small>
          </div>

          <div class="form-group">
            <label for="about">About Student</label>
            <textarea id="about" rows="5"></textarea>

            <small class="error" id="aboutError"></small>
          </div>

          <div class="form-group">
            <label for="photo">Profile Photo</label>
            <input type="file" id="photo" accept="image/*" />
            <small class="error" id="photoError"></small>
          </div>

          <button type="submit">Register Student</button>
        </form>
      </section>

      <section class="count-section">
        <h2>Total Students: <span id="studentCount">0</span></h2>
      </section>

      <section class="students-section">
        <h2>Registered Students</h2>

        <div id="studentCards" class="student-cards"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
