<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentForm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 class="header1">Student Application Management System</h1>
        <p class="header2">Register and manage student applications</p>
    </header>

    <form id="mainForm" action="/submit" method="POST">

        <label>
            Student Name:
            <input type="text" id="name" name="name" required>
        </label>

        <label>
            Email:
            <input type="email" id="email" name="email" required>
        </label>

        <label>
            Phone:
            <input type="text" id="phone" name="phone" required>
        </label>

        <label>
            DOB:
            <input type="date" id="dob" name="dob" required>
        </label>

        <label>
            Gender:
            <input type="radio" class="gend" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" class="gend" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </label>

        <label>
            Course:
            <select class="Course" name="course" required>
                <option value="">Select Course</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </label>

        <label>
            Skills:

            <input type="checkbox" class="skills" name="skills" value="HTML">
            <label>HTML</label>

            <input type="checkbox" class="skills" name="skills" value="CSS">
            <label>CSS</label>

            <input type="checkbox" class="skills" name="skills" value="JavaScript">
            <label>JavaScript</label>

            <input type="checkbox" class="skills" name="skills" value="GIT">
            <label>GIT</label>

            <input type="checkbox" class="skills" name="skills" value="React">
            <label>React</label>

            <input type="checkbox" class="skills" name="skills" value="Nodejs">
            <label>Node.js</label>
        </label>

        <label>
            About:
            <textarea id="about" name="about" maxlength="200" required></textarea>
        </label>

        <label>
            Profile Photo:
            <input type="file" class="pfp" id="profilePhoto" name="profilePhoto">
        </label>

        <button type="submit" id="submit">Submit</button>
        <button type="reset" id="reset">Reset</button>

    </form>

    <section class="counter">
        <h2>Total Students</h2>
        <p id="totalStudents">0</p>
    </section>

    <section class="rec">
    <h2>Submitted Students</h2>

    <div class="outerBox">
        <div id="studentsContainer" class="studentsContainer"></div>
    </div>
</section>

    <script src="script.js"></script>

</body>
</html>
