<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Application-Management-System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>
        </div>

        <button id="darkModeBtn" type="button">Dark Mode</button>
    </header>

    <main>
        <section>
            <h2>Student Registration </h2>
            <form id="studentForm">
                <div class="form-container">
                    <div>

                        <label for="studentName">Student Name</label>

                        <input type="text" id="studentName" placeholder="Enter student name">

                        <p class="error" id="nameError"></p>

                    </div>

                </div>

                <label for="email">Email</label>

                <input type="email" id="email" placeholder="Enter email">

                <p class="error" id="emailError"></p>

                </div>


                <div>

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="text" id="phone" placeholder="Enter phone number">

                    <p class="error" id="phoneError"></p>

                </div>


                <div>

                    <label for="dob">Date of Birth</label>

                    <input type="date" id="dob">

                    <p class="error" id="dobError"></p>

                </div>

                <div>

                    <label>Gender</label>

                    <div class="radio-box">

                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>

                    </div>

                    <p class="error" id="genderError"></p>

                </div>

                <div>

                    <label for="course">Course</label>

                    <select id="course">

                        <option value="">Select Course`</option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="UI/UX">
                            UI/UX
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="Data Analytics">
                            Data Analytics
                        </option>

                        <option value="MERN Stack">
                            MERN Stack
                        </option>

                        <option value="Cloud Computing">
                            Cloud Computing
                        </option>

                    </select>

                    <p class="error" id="courseError"></p>

                </div>

                <div class="full">

                    <label>Skills</label>

                    <div class="check-box">

                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="React">
                            React
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Node.js">
                            Node.js
                        </label>

                    </div>

                    <p class="error" id="skillsError"></p>

                </div>

                <div class="full">

                    <label for="about">
                        About Student
                    </label>

                    <textarea id="about" maxlength="200" placeholder="Write about student"></textarea>

                    <p id="charCount">
                        0 / 200
                    </p>

                    <p class="error" id="aboutError"></p>

                </div>

                <div class="full">

                    <label for="profilePhoto">
                        Profile Photo
                    </label>

                    <input type="file" id="profilePhoto" accept="image">

                    <p class="error" id="photoError"></p>

                </div>

                </div>


                <div class="buttons">

                    <button type="submit" id="submitBtn">
                        Register Student
                    </button>

                    <button type="button" id="resetBtn">
                        Reset Form
                    </button>

                </div>

            </form>

        </section>

        </section>




        </form>
        </section>

    </main>
    <script src="script.js"></script>

</body>

</html>
