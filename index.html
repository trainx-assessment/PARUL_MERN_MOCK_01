<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        <div id="main">
            <section id="registration">
                <h2>Student Registration Form</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div class="radio-group">
                            <input type="radio" name="gender" value="Male"> Male
                            <input type="radio" name="gender" value="Female"> Female
                            <input type="radio" name="gender" value="Other"> Other
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="">Select Course</option>
                            <option>Web Development</option>
                            <option>UI/UX</option>
                            <option>Python</option>
                            <option>Data Analytics</option>
                            <option>MERN Stack</option>
                            <option>Cloud Computing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Skills</label>
                        <div class="checkbox-group">
                            <input type="checkbox" value="HTML"> HTML
                            <input type="checkbox" value="CSS"> CSS
                            <input type="checkbox" value="JavaScript"> JavaScript
                            <input type="checkbox" value="Git"> Git
                            <input type="checkbox" value="React"> React
                            <input type="checkbox" value="Node.js"> Node.js
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="about">About Student</label>
                        <textarea id="about" maxlength="200"></textarea>
                      
                    </div>
                    <div class="form-group">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" accept="image/*" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Register Student</button>
                        <button type="reset" class="btn-secondary">Reset Form</button>
                    </div>
                </form>
            </section>

            <section id="studentContainer">
                <h2>Student Applications</h2>
                <div id="cards"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Student Application Management System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
