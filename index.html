<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        <section>
            <form action="" id="form">
                <div>
                    <label for="name">Name : </label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div>
                    <label for="email">Email : </label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div>
                    <label for="phone">Telephone : </label>
                    <input type="tel" name="phone" id="phone" required>
                </div>
                <div>
                    <label for="dob">Date of Birth : </label>
                    <input type="date" name="dob" id="dob" required>
                </div>
                <div>
                    <label>Gender :</label>
                    <input type="radio" name="gender" value="Male" id="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" value="Female" id="female">
                    <label for="female">Female</label>
                    <input type="radio" name="gender" value="Other" id="other">
                    <label for="other">Other</label>
                </div>

                <div>
                    <label for="course">Course : </label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analystics">Data Analystics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>

                </div>
                <div>
                    <label>Skills : </label>
                    <input type="checkbox" name="HTML" id="skill">
                    <label>HTML</label>
                    <input type="checkbox" name="CSS" id="skill">
                    <label>CSS</label>
                    <input type="checkbox" name="JavaScript" id="skill">
                    <label>JavaScript</label>
                    <input type="checkbox" name="Git" id="skill">
                    <label>Git</label>
                    <input type="checkbox" name="React" id="skill">
                    <label>React</label>
                    <input type="checkbox" name="Node.js" id="skill">
                    <label for="Node.js">Node.js</label>
                </div>
                <div>
                    <label for="about">About : </label>
                    <input type="text" name="about" id="about" placeholder="Maximum 200 characters">
                </div>
                <div>
                    <label for="photo">Profile Photo : </label>
                    <input type="file" name="photo" id="photo">
                </div>
                <div></div>
                <button class="s_btn">Register Student</button>
                <button class="f_btn">Reset Form</button>
                
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
