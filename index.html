<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>  
        <h1>Student Application Manager</h1>
        <p>Student Registration, Statistics and Applications</p>
    </header>

    <main class="container">

        <!-- Student Registration -->
        <section>
            <h2>Student Registration</h2>

            <form id="studentForm">

                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name">

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email">

                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10 digit phone number">

                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob">
                </fieldset>


                <fieldset class="option-fields">

                    <legend>Gender</legend>
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male">
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other">
                        Other
                    </label>

                </fieldset>
                <fieldset>
                    <legend>Course</legend>
                    <label for="course">Select Course</label>
                    <select id="course">
                        <option value="">Select a course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                    </select>
                </fieldset>


                <fieldset class="option-fields">
                    <legend>Skills</legend>
                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="HTML">
                        HTML
                    </label>
                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="CSS">
                        CSS
                    </label>
                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="JavaScript">
                        JavaScript
                    </label>
                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Git">
                        Git
                    </label>
                </fieldset>

                <fieldset>
                    <legend>About Student</legend>
                    <label for="about">About</label>
                    <textarea
                        id="about"
                        rows="5"
                        placeholder="Write something about the student..."></textarea>

                </fieldset>

                <fieldset>
                    <legend>Profile Photo</legend>
                    <label for="photo">Upload Photo</label>
                    <input
                        type="file"
                        id="photo"
                        accept="image/*">
                </fieldset>

                <div class="buttons">
                    <button type="submit">
                        Add Student
                    </button>
                    <button type="reset">
                        Reset
                    </button>
                </div>
            </form>
        </section>

        <!-- Statistics + Applications -->
        <div class="dashboard">
            <!-- Statistics -->
            <section>
                <h2>Student Statistics</h2>
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p id="studentCount">0</p>
                </div>
            </section>

            <!-- Applications -->
            <section>
                <h2>Student Applications</h2>
                <div
                    class="student-container"
                    id="studentContainer"
                ></div>
            </section>
        </div>
    </main>

    <footer>
        <p>Student Application Manager</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
