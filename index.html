<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
    </header>

    <main>
        <section class="form-box">
            <h2>Student Registration</h2>

            <form id="studentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" maxlength="40" required>
                        <small class="error" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                        <small class="error" id="emailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" required>
                        <small class="error" id="phoneError"></small>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                        <small class="error" id="dobError"></small>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <div class="radio-row">
                            <label><input type="radio" name="gender" value="Male"> Male</label>
                            <label><input type="radio" name="gender" value="Female"> Female</label>
                            <label><input type="radio" name="gender" value="Other"> Other</label>
                        </div>
                        <small class="error" id="genderError"></small>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="">Select Course</option>
                            <option>Web Development</option>
                            <option>UI/UX</option>
                            <option>Python</option>
                            <option>Data Analytics</option>
                            <option>MERN Stack</option>
                            <option>Cloud Computing</option>
                        </select>
                        <small class="error" id="courseError"></small>
                    </div>

                    <div class="form-group full">
                        <label>Skills</label>
                        <div class="check-row">
                            <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                            <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                            <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                            <label><input type="checkbox" name="skills" value="Git"> Git</label>
                            <label><input type="checkbox" name="skills" value="React"> React</label>
                            <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                        </div>
                        <small class="error" id="skillsError"></small>
                    </div>

                    <div class="form-group full">
                        <label for="about">About Student</label>
                        <textarea id="about" maxlength="200" rows="5" required></textarea>
                        
                        
                    </div>

                    <div class="form-group full">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" accept="image/*" required>
                        <small class="error" id="photoError"></small>
                    </div>
                </div>

                <div class="button-row">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="button" id="resetBtn">Reset Form</button>
                </div>
            </form>
        </section>

        <section class="stats">
            <h2>Student Statistics</h2>
            <div class="stats-grid">
                <div class="stat"><b>Total Students</b><span id="totalStudents">0</span></div>
                <div class="stat"><b>Web Development</b><span id="webCount">0</span></div>
                <div class="stat"><b>UI/UX</b><span id="uiCount">0</span></div>
                <div class="stat"><b>Python</b><span id="pythonCount">0</span></div>
                <div class="stat"><b>Data Analytics</b><span id="dataCount">0</span></div>
                <div class="stat"><b>MERN Stack</b><span id="mernCount">0</span></div>
                <div class="stat"><b>Cloud Computing</b><span id="cloudCount">0</span></div>
            </div>
        </section>

        <section>
            <h2>Students</h2>
            <div id="studentContainer" class="student-container"></div>
        </section>
    </main>

    

    <script src="script.js"></script>
</body>
</html>
