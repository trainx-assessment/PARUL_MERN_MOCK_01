                </div>
            </div>
            <div class="each">
                Please select Course :- 
                
            </div>
            <div class="eee">
                Your Skills  
                <div class="each">
                    <div class="each1">
                        <input type="checkbox" name="s1" id="1"> HTML
                        <input type="checkbox" name="s2" id="1"> CSS
                        <input type="checkbox" name="s3" id="1"> JS
                        <input type="checkbox" name="s3" id="1"> Git
                        <input type="checkbox" name="s3" id="1"> React
                        <input type="checkbox" name="s3" id="1"> Node.JS
                    </div>
                </div>
            </div>
            <input type="text" class = "about">
            <div class="each">Profile Pic :- <input type="file" name="" id=""></div>

                <button>Register</button>
                <button>Reset</button>
