<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
    </header>

    <main>

        <section>
            <h2>Registration</h2>

            <form id="studentForm">

                <label>Name</label>
                <input type="text" id="studentName">

                <label>Email</label>
                <input type="email" id="studentEmail">

                <label>Phone</label>
                <input type="text" id="studentPhone">

                <label>Date of Birth</label>
                <input type="date" id="studentDob">

                <label>Gender</label>

                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other

                <br><br>

                <label>Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option>Web Development</option>
                    <option>UI/UX</option>
                    <option>Python</option>
                    <option>Data Analytics</option>
                    <option>MERN Stack</option>
                    <option>Cloud Computing</option>
                </select>

                <label>Skills</label>

                <input type="checkbox" name="skills" value="HTML"> HTML
                <input type="checkbox" name="skills" value="CSS"> CSS
                <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                <input type="checkbox" name="skills" value="Git"> Git
       
                <br><br>
            

                <label>About Student</label>
                <textarea id="aboutStudent" maxlength="200"></textarea>

                <br>

                <label>Profile Photo</label>
                <input type="file" id="profilePhoto" accept="image/*">

                <br><br>

                <button type="submit" id="submitBtn">
                    Register Student
                </button>

                <button type="reset">
                    Reset Form
                </button>

            </form>
        </section>


        <section>
            <h2>Statistics</h2>

            <p>Total Students: <span id="totalStudents">0</span></p>
            <p>Web Development: <span id="webDevelopmentCount">0</span></p>
            <p>Data Analytics: <span id="dataAnalyticsCount">0</span></p>
            <p>MERN Stack: <span id="mernCount">0</span></p>
            <p>Cloud Computing: <span id="cloudCount">0</span></p>
        </section>


        <section>
            <h2>Search Students</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name..."
            >

            <select id="courseFilter">
                <option>All Courses</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>
        </section>


       

    </main>


    <script src="script.js"></script>

</body>
</html>
