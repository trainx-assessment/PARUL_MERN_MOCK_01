<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>Student Application Management System</h1>
                <h3>Register and manage student applications</h3>
            </div>
        </div>    
    </header>

    <main class="container">
        <section class="form-group">
            <form id="stuForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="studentName">Student Name: </label>
                        <input type="text" id="studentName" placeholder="Enter name...">
                    </div>

                    <div class="form-group">
                        <label for="email">Email: </label>
                        <input type="email" id="email" placeholder="Enter email...">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number: </label>
                        <input type="text" id="phone" placeholder="Enter phone number...">
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth: </label>
                        <input type="date" id="dob">
                    </div>

                    <div class="form-group">
                        <label>Gender: </label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="Male"> Male</label>
                            <label><input type="radio" name="gender" value="Female"> Female</label>
                            <label><input type="radio" name="gender" value="Other"> Other</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="course">Course: </label>
                        <select id="course">
                            <option value="">Select Course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Python">Python</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="MERN Stack">MERN Stack</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Skills: </label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                            <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                            <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                            <label><input type="checkbox" name="skills" value="Git"> Git</label>
                            <label><input type="checkbox" name="skills" value="React"> React</label>
                            <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="about">About Student: </label>
                        <textarea id="about" rows="3" placeholder="About yourself"></textarea>
                        <span id="charCount">0 / 200</span>
                    </div>

                    <div>
                        <label for="photo">Profile Photo: </label>
                        <input type="file" id="photo" accept="image/png, image/jpeg, image/jpg">
                    </div>

                    <div class="form-group">
                        <button type="submit" id="submitBtn" class="btn primary-btn">Register Student</button>
                        <button type="button" id="resetBtn" class="btn secondary-btn">Reset Form</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Student Cards Container -->
        <section id="studentContainer" class="students-grid"></section>

        <section class="card stats-section">
            <h2>Student Statistics</h2>
            <h3 id="totalStudents">Total Students: 0</h3>
            <div class="stats-grid" id="courseStats">
                <p>Web Development: <span data-course="Web Development">0</span></p>
                <p>UI/UX: <span data-course="UI/UX">0</span></p>
                <p>Python: <span data-course="Python">0</span></p>
                <p>Data Analytics: <span data-course="Data Analytics">0</span></p>
                <p>MERN Stack: <span data-course="MERN Stack">0</span></p>
                <p>Cloud Computing: <span data-course="Cloud Computing">0</span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
