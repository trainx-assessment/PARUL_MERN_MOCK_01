<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Applications</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><div><p class="eyebrow">Admissions desk</p><h1>Student Applications</h1><p>Register and manage student applications.</p></div><button id="themeToggle" class="theme-button" type="button">Dark Mode</button></header>
  <main class="page-shell">
    <section class="panel form-panel"><div class="section-heading"><div><p class="eyebrow">New record</p><h2>Register a student</h2></div><span id="formMode">Create</span></div>
      <form id="studentForm" novalidate><div class="form-grid">
        <div class="field"><label for="studentName">Student Name</label><input type="text" id="studentName" maxlength="40"><small class="error" data-error-for="studentName"></small></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email"><small class="error" data-error-for="email"></small></div>
        <div class="field"><label for="phone">Phone Number</label><input type="text" id="phone" inputmode="numeric" maxlength="10"><small class="error" data-error-for="phone"></small></div>
        <div class="field"><label for="dob">Date of Birth</label><input type="date" id="dob"><small class="error" data-error-for="dob"></small></div>
        <fieldset class="field"><legend>Gender</legend><div class="options"><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Other"> Other</label></div><small class="error" data-error-for="gender"></small></fieldset>
        <div class="field"><label for="course">Course</label><select id="course"><option value="">Select Course</option><option>Web Development</option><option>UI/UX</option><option>Python</option><option>Data Analytics</option><option>MERN Stack</option><option>Cloud Computing</option></select><small class="error" data-error-for="course"></small></div>
        <fieldset class="field full-width"><legend>Skills</legend><div class="options skills"></div><small class="error" data-error-for="skills"></small></fieldset>
        <div class="field full-width"><label for="about">About Student <span id="characterCount">0 / 200</span></label><textarea id="about" maxlength="200"></textarea><small class="error" data-error-for="about"></small></div>
        <div class="field full-width"><label for="photo">Profile Photo</label><input type="file" id="photo" accept="image/*"><small class="error" data-error-for="photo"></small></div>
      </div><div class="form-actions"><button class="primary" type="submit" id="submitButton">Register Student</button><button class="secondary" type="reset">Reset Form</button></div></form>
    </section>
    <section class="stats" aria-label="Student statistics"><div class="stat total"><span>Total Students</span><strong id="totalStudents">0</strong></div><div id="courseStats" class="course-stats"></div></section>
    <section class="panel applications"><div class="section-heading"><div><p class="eyebrow">Directory</p><h2>Applications</h2></div><div class="filters"><input id="searchInput" type="search" placeholder="Search student by name..." aria-label="Search student by name"><select id="courseFilter" aria-label="Filter by course"><option>All Courses</option><option>Web Development</option><option>UI/UX</option><option>Python</option><option>Data Analytics</option><option>MERN Stack</option><option>Cloud Computing</option></select></div></div><div id="studentContainer" class="student-grid"></div></section>
  </main>
  <footer>Student Application Management System</footer>
  <script src="script.js"></script>
