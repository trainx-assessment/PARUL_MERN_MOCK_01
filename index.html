<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>

        <div id="registration-section">
            <h2>Student Registration</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter student name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                    >
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills</label>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="React">
                            React
                        </label>

                        <label>
                            <input type="checkbox" name="skills" value="Node.js">
                            Node.js
                        </label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="about">About Student</label>

                    <textarea
                        id="about"
                        name="about"
                        maxlength="200"
                        placeholder="Tell me about yourself..."
                    ></textarea>

                    <div id="characterCounter">0 / 200</div>
                </div>

                <div class="form-group full-width">
                    <label for="profilePhoto">Profile Photo</label>

                    <input
                        type="file"
                        id="profilePhoto"
                        name="profilePhoto"
                        accept=".jpg,.jpeg,"
                    >
                </div>

                <div class="button-group full-width">
                    <button type="submit" id="submitButton">
                        Register Student
                    </button>

                    <button type="button" id="resetButton">
                        Reset Form
                    </button>
                </div>

            </form>

        </div>

    </main>


    <footer>
        <p>Student Application Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
