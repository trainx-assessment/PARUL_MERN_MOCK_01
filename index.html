<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <main>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage Student Application</p>
    </header>
    
         <section id="registration">
            <h2>Student Registration</h2>
            <form id="studentForm"></form>
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName">
                    <small class="error"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    <small class="error"></small>
                </div>
                 <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone">
                    <small class="error"></small>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                    <small class="error"></small>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">Male</label>
                         <label>
                            <input type="radio" name="gender" value="Female">Female</label>
                        <label>
                            <input type="radio" name="gender" value="Other">Other</label>
                    </div>
                    <small class="error"></small>
                </div>
                
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option>Web Development</option>
                        <option>UI/UX</option>
                        <option>Python</option>
                        <option>Data Analytics</option>
                        <option>MERN Stack</option>
                        <option>Cloud Computing</option>
                    </select>
                    <small class="error"></small>
                </div>
                
                <div class="form-group full-width">
                    <label>Skills</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="HTML"> HTML </label> 
                        <label><input type="checkbox" value="CSS"> CSS </label> 
                        <label><input type="checkbox" value="JavaScript"> JavaScript </label> 
                        <label><input type="checkbox" value="Git"> Git </label> 
                        <label><input type="checkbox" value="React"> React </label>
                        <label><input type="checkbox" value="Node.js"> Node.js </label> 
                    </div>
                    <small class="error"></small>
                </div>
                <br>
                <div class="form-group full-width">
                    <label for="about">About Student</label>
                    <textarea
                        id="about"
                        rows="10"
                        cols="90"
                        maxlength="200"
                        placeholder="Write about the student.."></textarea>
                    <p id="charCount">0/200</p>

                    <small class="error"></small>
                </div>
                <div class="form-group full-width">
                    <label for="photo"> Profile Photo </label>
                    <input
                        type="file"
                        id="photo"
                        accept=".jpg,.jpeg,.png">
                    <small class="error"></small>
                </div>
                <div class="button-group">
                    <button type="submit" id="submitBtn"> Register Student </button>
                    <button type="reset"> Reset Form </button>
                </div>
            </form>
        </section>

        <section id="statistics">
            <h2>Student Statistics</h2>
            <div class="stats">
                <p>Total Students: <span id="totalStudents">--</span></p>
                <p>Web Development: <span id="webCount">--</span></p>
                <p>UI/UX: <span id="uiCount">--</span></p>
                <p>Python: <span id="pythonCount">--</span></p>
                <p>Data Analytics: <span id="dataCount">--</span></p>
                <p>MERN Stack: <span id="mernCount">--</span></p>
                <p>Cloud Computing: <span id="cloudCount">--</span></p>
            </div>
        </section>

        <section id="searchSection">
            <h2>Search & Filter </h2>
            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name...">
            <select id="filterCourse">
                <option value="All">All Courses</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>
        </section>

        <section id="students">
            <h2>Registered Students</h2>
            <div id="studentContainer">
                <!-- Student Cards will be added using JavaScript -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
