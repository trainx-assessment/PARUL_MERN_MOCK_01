<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Student Application Management System</h1>

    <h2 style="text-align: center;">Register and manage student applications</h2>


    <section id="form">
            <h2 style="text-align :center ;">Student Registration Form</h2>
            <form>
                <div>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div>
                    <label for="DOB">Date Of Birth:</label>
                    <input type="DOB" id="DOB" name="DOB">
                </div>
               
                <div>
                    <label for="Gender">Gender:</label>
                    <input type="text" id="Gender" name="Gender">
                </div>
                
                <div>
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web-Development">Web Development</option>
                        <option value="UI-UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="Mern-Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
                
                <div>
                    <label for="Skills">Year:</label>
                    <input type="checkbox" ><label for="">HTML</label>
                    <input type="checkbox" ><label for="">CSS</label>
                    <input type="checkbox" ><label for="">JavaScrpit</label>
                    <input type="checkbox" ><label for="">Git</label>
                    <input type="checkbox" ><label for="">React</label>
                    <input type="checkbox" ><label for="">Node.js</label>
                </div>
                
                <div>
                     <label for="text">About YOU:</label>
                    <input type="text" id="text" name="text" minlength="0" maxlength="200">
                </div>
                
                <div>
                    <label for="Profile-Photo">Profile Photo</label>
                    <input type="file" id="Profile-Photo" name="Profile-Photo" accept="image/*" >

                </div>
                <br>
                <br>

                
                <button type="submit">Register Student</button>
                <button type="reset">Reset Form</button>


                
            </form>
        </section>
    

    <script src="script.js"></script>
    
</body>
</html>
