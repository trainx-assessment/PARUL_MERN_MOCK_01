<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Application Manager</h1>
            <p>Register and Manage Application</p>
        </header>
        <section class="form section">
            <h2>Student Registration Form</h2>
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter Student Name"/>
            </div> <br>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email address"/>
            </div> <br>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="Enter 10 digit phone number"/>
            </div> <br>
            <div class="form-group">
                <label for="date">Date of birth</label>
                <input type="date" required>
            </div><br>
            <div class="form-group">
            <label>Gender</label>
            <div class="options">
              <label><input type="radio" name="gender" value="Male" /> Male</label>
              <label><input type="radio" name="gender" value="Female" /> Female</label>
              <label><input type="radio" name="gender" value="Other" /> Other</label>
            </div> <br>
            <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course">
                     <option value="Select Course"></option>
                <option value="Web development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>   
                    </select>
            </div> <br>
            <form class="form-group">
            <label>Skills</label>
            <div class="options">
              <label><input type="checkbox" name="skills" value="HTML" /> HTML</label>
              <label><input type="checkbox" name="skills" value="CSS" /> CSS</label>
              <label><input type="checkbox" name="skills" value="JavaScript" /> JavaScript</label>
              <label><input type="checkbox" name="skills" value="Git" /> Git</label>
            </div> <br>
            <div class="form-group">
            <label for="about">About Student</label>
            <textarea id="about" rows="5" placeholder="Write something about the student"></textarea>
          </div> <br>
          <div class="form-group">
            <label for="photo">Profile Photo</label>
            <input type="file" id="photo" accept="image/*"/>
          </div> <br>
          <button type="submit">Submit</button>
        </form>
        </section>
         <section class="students-section">
        <h2>Registered Students</h2>
        <div id="studentsContainer" class="students-container">
          <p id="emptyMessage">No students registered yet.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
