
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Application Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
  </header>

  <main>
    <section>
      <form id="studentForm">
        <label for="name">Student Name</label>
        <input type="text" id="name" required>
        <label for="email">Email</label>

        <input type="email" id="email" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <fieldset>
          <legend>Gender</legend>
          <input type="radio" name="gender" value="Male"> Male
          
          <input type="radio" name="gender" value="Female"> Female
          <input type="radio" name="gender" value="Other"> Other
        </fieldset>

        <label for="course">Course</label>
        <select id="course">
          <option>Select Course</option>
          <option>Web Development</option>
         
          <option>Data Science</option>
          <option>Python</option>
          <option>Data Analytics</option>
          <option>MERN Stack</option>
          <option>Cloud Computing</option>
        </select>

        <fieldset>
          <legend>Skills</legend>
          <input type="checkbox" value="HTML"> HTML
          <input type="checkbox" value="CSS"> CSS
          <input type="checkbox" value="JavaScript"> JavaScript
          <input type="checkbox" value="Git"> Git
          <input type="checkbox" value="React"> React
          <input type="checkbox" value="Node.js"> Node.js
        </fieldset>

        <label for="about">About Student</label>
        <textarea id="about" maxlength="200"></textarea>
        <p id="charCount">0 / 200</p>

        <label for="photo">Profile Photo</label>
        <input type="file" id="photo" accept="image/*">

        <button type="submit">Register Student</button>
        <button type="reset">Reset Form</button>
      </form>
      
    </section>

    <section id="statistics">
      <h2>Statistics</h2>
      <p>Total Students: <span id="totalStudents">0</span></p>
      <ul id="courseStats"></ul>
    </section>
    <section>
      <input type="text" id="search" placeholder="Search student by name...">
      <select id="filterCourse">
        <option>All Courses</option>
        <option>Web Development</option>
        <option>UI/UX</option>
        <option>Python</option>
        <option>Data Analytics</option>
        <option>MERN Stack</option>
        <option>Cloud Computing</option>
      </select>
    </section>
    <section id="studentContainer"></section>
  </main>

  <footer>
    <p> 2026 Student Management System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
