<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><h2>Student Application Management System</h2></header><hr>
    <main>
        <!-- registratioon from-->
        <section id="registration-form">

            <h2>Student Registration Form</h2><br>
            <form id="student-form">
                <div class="form-group">
                    <label for="name">Student Name : </label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email : </label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number: </label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birthh : </label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                        <input type="radio" id="other" name="gender" value="Other">
                        <label for="other">Other</label>
                    </div>
                </div>


                <!-- Courses -->
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Web Development">
                            Web Development
                        </option>
                        <option value="UI/UX">
                            UI/UX
                        </option>
                        <option value="Python">
                            Python
                        </option>
                        <option value="Data Analytics">
                            Data Analytics
                        </option>
                        <option value="MERN Stack">
                            MERN Stack
                        </option>
                        <option value="Cloud Computing">
                            Cloud Computing
                        </option>
                    </select>
                </div>
                <!-- Skills -->
                <div class="form-group">
                    <label>Skills</label>
                    <div class="skills-group">
                        <div>
                            <input type="checkbox" id="html" value="HTML">
                            <label for="html">HTML</label>
                        </div>
                        <div>
                            <input type="checkbox" id="css" value="CSS">
                            <label for="css">CSS</label>
                        </div>
                        <div>
                            <input type="checkbox" id="javascript" value="JavaScript">
                            <label for="javascript">JavaScript</label>
                        </div>
                        <div>
                            <input type="checkbox" id="git" value="Git">
                            <label for="git">Git</label>
                        </div>
                        <div>
                            <input type="checkbox" id="react" value="React">
                            <label for="react">React</label>
                        </div>
                        <div>
                            <input type="checkbox" id="nodejs" value="Node.js">
                            <label for="nodejs">Node.js</label>
                        </div>
                    </div>
                </div>
                <!-- About Student -->
                <div class="form-group ">
                    <label for="about">About Student</label>
                    <textarea id="about" name="about" maxlength="200" placeholder="about"required></textarea>
                </div>


                <!-- profile-Photo -->
                <div class="form-group ">
                    <label for="profile">Profile Photo</label>
                    <input type="file" id="profile" name="profile" accept=".jpg,.jpeg,.png" required>
                </div>
                <!-- buttons -->
                <div class="form-buttons">
                    <button id="submit-btn" type="submit">
                        Register Student
                    </button>


                    <button id="reset-btn" type="reset">
                        Reset Form
                    </button>
                </div>
            </form>

        </section>


        <!-- statistics -->

        <section id="statistics">
            <h2>Student Statistics</h2>
            <div class="statistics">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p id="total-students">0</p>
                </div>
                <div class="stat-card">
                    <h3>Web Development</h3>
                    <p id="web-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>UI/UX</h3>
                    <p id="uiux-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Python</h3>
                    <p id="python-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Data Analytics</h3>
                    <p id="data-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>MERN Stack</h3>
                    <p id="mern-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Cloud Computing</h3>
                    <p id="cloud-count">0</p>
                </div>
            </div>
        </section>
       <!-- search bar -->
        <section id="search-section">
            <h2>Search Students</h2>
            <div class="search-filter">

                <input type="text" id="search" placeholder="Search name">
                <select id="course-filter">

                    <option value="">All Courses</option>
                    <option value="Web Development">
                        Web Development
                    </option>
                    <option value="UI/UX">
                        UI/UX
                    </option>
                    <option value="Python">
                        Python
                    </option>
                    <option value="Data Analytics">
                        Data Analytics
                    </option>
                    <option value="MERN Stack">
                        MERN Stack
                    </option>
                    <option value="Cloud Computing">
                        Cloud Computing
                    </option>
                </select>
            </div>
        </section>
      <section id="students-section">
            <h2>Student Applications</h2>
            <div id="student-container"></div>
        </section>
    </main><hr>
    <section>
        <h3>Student Statistics</h3>
    </section>
    <hr>

    <footer>
        <p>@amancodexz - 2403051050673</p>
    </footer>


    <script src="script.js"></script>
</body>

</html>
