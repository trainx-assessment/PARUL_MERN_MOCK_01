<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management ApplicationSystem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
</header>
<main>
    <section>
        <h2>Student Registration</h2>
        <form id="form">
            <div class="form">
                <div>
                    <label for="name">Student Name</label>
                    <input type="text" id="name">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone">
                </div>
                <div>
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div>
                    <label>Gender</label>
                    <div class="options">
                        <label><input type="radio" name="gender" value="Male">Male</label>
                        <label><input type="radio" name="gender" value="Female">Female</label>
                        <label><input type="radio" name="gender" value="Other">Other</label>
                    </div>
                </div>
                <div>
                    <label for="course">Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option>Web Development</option>
                        <option>UI/UX</option>
                        <option>Python</option>
                        <option>Data Analytics</option>
                        <option>MERN Stack</option>
                        <option>Cloud Computing</option>
                    </select>
                </div>
                <div class="full">
                    <label>Skills</label>
                    <div class="options">
                        <label><input type="checkbox" name="skills" value="HTML">HTML</label>
                        <label><input type="checkbox" name="skills" value="CSS">CSS</label>
                        <label><input type="checkbox" name="skills" value="JavaScript">JavaScript</label>
                        <label><input type="checkbox" name="skills" value="Git">Git</label>
                        <label><input type="checkbox" name="skills" value="React">React</label>
                        <label><input type="checkbox" name="skills" value="Node.js">Node.js</label>
                    </div>
                </div>
                <div class="full">
                    <label for="about">About Student</label>
                    <textarea id="about" maxlength="200"></textarea>
                    <p id="count">0/200</p>
                </div>
                <div class="full">
                    <label for="photo">Profile Picture</label>
                    <input type="file" id="photo" accept="image/*">
                </div>
            </div>
            <button type="submit" id="submit">Register Student</button>
            <button type="button" id="reset">Reset Form</button>
        </form>
    </section>
    <section>
        <h2>Student Statistics</h2>
        <div class="stats">
            <div>
                <h3>Total Students</h3>
                <p id="total">0</p>
            </div>
            <div>
                <h3>Web Development</h3>
                <p id="web">0</p>
            </div>
            <div>
                <h3>UI/UX</h3>
                <p id="ui">0</p>
            </div>
            <div>
                <h3>Python</h3>
                <p id="python">0</p>
            </div>
            <div>
                <h3>Data Analytics</h3>
                <p id="data">0</p>
            </div>
            <div>
                <h3>MERN Stack</h3>
                <p id="mern">0</p>
            </div>
            <div>
                <h3>Cloud Computing</h3>
                <p id="cloud">0</p>
            </div>
        </div>
    </section>
    <section>
        <h2>Students</h2>
        <div class="search">
            <input type="text"id="search"placeholder="Search student name">
            <select id="Select Course">
                <option>All Courses</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
            </select>
        </div>
        <div id="list" class="cards"></div>
    </section>
</main>
<footer>
    <p>Student Application Management System</p>
</footer>
<script src="script.js"></script>
</body>
</html>
