<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>
    <main>
      <section>
        <h2>Student Registration</h2>
        <form id="studentForm">
          <label>Student Name</label>
          <input type="text" id="studentName" />
          <small id="studentNameError"></small>
          <label>Email</label>
          <input type="email" id="email" />
          <small id="emailError"></small>
          <label>Phone</label>
          <input type="text" id="phone" />
          <small id="phoneError"></small>
          <label>Date of Birth</label>
          <input type="date" id="dob" />
          <small id="dobError"></small>
          <label>Gender</label>
          <input type="radio" name="gender" value="Male" />
          Male
          <input type="radio" name="gender" value="Female" />
          Female
          <input type="radio" name="gender" value="Other" />
          Other
          <small id="genderError"></small>
          <label>Course</label>
          <select id="course">
            <option value="">Select Course</option>
            <option>Web Development</option>
            <option>UI/UX</option>
            <option>Python</option>
            <option>Data Analytics</option>
            <option>MERN Stack</option>
            <option>Cloud Computing</option>
            <option>CSE(AIML)</option>
          </select>
          <small id="courseError"></small>
          <label>Skills</label>
          <input type="checkbox" name="skills" value="HTML" />
          HTML
          <input type="checkbox" name="skills" value="CSS" />
          CS
          <input type="checkbox" name="skills" value="JavaScript" />
          JavaScript
          <input type="checkbox" name="skills" value="Git" />
          Git
          <input type="checkbox" name="skills" value="React" />
          React
          <input type="checkbox" name="skills" value="Node.js" />
          Node.js
          <small id="skillsError"></small>
          <label>About Student</label>
          <textarea
            id="about"
            maxlength="200"
            placeholder="Write about student"
          >
          </textarea>
          <p id="charCount">0 / 200</p>
          <small id="aboutError"></small>
          <label>Profile Photo</label>
          <input type="file" id="profilePhoto" accept="image.png" />
          <small id="photoError"></small>
          <br /><br />
          <button type="submit" id="submitBtn">Register Student</button>
          <button type="button" id="resetBtn">Reset Form</button>
        </form>
      </section>
    <footer>
      <p>Student Application Management System</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
