<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1 id="project-title">Student Application Management System</h1>
    </header>
    <main>
      <section class="form-section">
        <h2>Student Registration Form</h2>
        <form id="studentForm">
          <div class="form-row">
            <div class="form-group">
              <label for="studentName">Student Name - </label>
              <input
                type="text"
                id="studentName"
                placeholder="Enter full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email - </label>
              <input
                type="email"
                id="email"
                placeholder="student@gmail.com"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number - </label>
              <input type="text" id="phone" required />
            </div>

            <div class="form-group">
              <label for="dob">Date of Birth - </label>
              <input type="date" id="dob" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Gender - </label>
              <div class="radio-group">
                <label
                  ><input type="radio" name="gender" value="Male" /> Male</label
                >
                <label
                  ><input type="radio" name="gender" value="Female" />
                  Female</label
                >
                <label
                  ><input type="radio" name="gender" value="Other" />
                  Other</label
                >
              </div>
            </div>

            <div class="form-group">
              <label for="course">Course - </label>
              <select id="course" required>
                <option value="">Select Course</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Skills - </label>
            <div class="checkbox-group">
              <label
                ><input type="checkbox" name="skills" value="HTML" />
                HTML</label
              >
              <label
                ><input type="checkbox" name="skills" value="CSS" /> CSS</label
              >
              <label
                ><input type="checkbox" name="skills" value="JavaScript" />
                JavaScript</label
              >
              <label
                ><input type="checkbox" name="skills" value="Git" /> Git</label
              >
              <label
                ><input
                  type="checkbox"
                  name="skills"
                  value="React"
                />React</label
              >
              <label
                ><input
                  type="checkbox"
                  name="skills"
                  value="Node.js"
                />Node.js</label
              >
            </div>
          </div>

          <div class="form-group">
            <label for="about">About Student - </label>
            <textarea
              id="about"
              placeholder="Write here"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="profilePhoto">Profile Photo - </label>
            <input type="file" id="profilePhoto" accept="image/*" required />
          </div>

          <div class="form-buttons">
            <button type="submit" id="submitBtn">Register Student</button>
            <button type="reset">Reset Form</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
