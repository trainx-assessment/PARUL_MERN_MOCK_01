<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> Student Registration Form</header>
    <main>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" name="name" placeholder="Enter your name" required><br><br>
            <label for="email">Email:</label><br>
            <input type="email" name="email" placeholder="Enter your email" required><br><br>
            <label for="age">Age:</label><br>
            <input type="number" name="age" placeholder="Enter your age" required><br><br>
            <label for="Mobile">Mobile:</label><br>
            <input type="tel" name="mobile" placeholder="Enter your mobile number" required><br><br>
            <label for="course">Course:</label><br>
            <input type="text" name="course" placeholder="Enter your course" required><br><br>
            <!-- <input type="submit" value="Register"> -->
        </form>
    </main>
    <footer>
        <input type="submit" value="Register">
    </footer>
    <!-- <script src="script.js"></script> -->
</body>
</html>
