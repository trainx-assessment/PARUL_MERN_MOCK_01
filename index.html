<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        
        <section id="registration-section">
            <h2>Student Registration</h2>

            <form id="studentForm">
                 
        <!-- Student Name -->
        <div class="form-group">
        <label for="studentName">Student Name</label>
        <input  type="text" id="studentName" name="studentName" placeholder="Enter student name"  required>
        <small class="error-message" id="nameError"></small>
    </div>


    <!-- Email -->
    <div class="form-group">
        <label for="studentEmail">Email</label>
        <input type="email" id="studentEmail" name="studentEmail" placeholder="Enter email address" required >
        <small class="error-message" id="emailError"></small>
    </div>


    <!-- Phone Number -->
    <div class="form-group">
        <label for="studentPhone">Phone Number</label>
        <input  type="text"  id="studentPhone"  name="studentPhone"  placeholder="Enter 10-digit phone number"  required >
        <small class="error-message" id="phoneError"></small>
    </div>


    <!-- Date of Birth -->
    <div class="form-group">
        <label for="studentDob">Date of Birth</label>
        <input type="date"  id="studentDob"  name="studentDob" required>
        <small class="error-message" id="dobError"></small>
    </div>


    <!-- Gender -->
    <div class="form-group">
        <label>Gender</label>

        <div class="radio-group">

            <label><input type="radio" name="gender" value="Male">Male</label>
            <label><input  type="radio" name="gender" value="Female" >Female</label>
            <label> <input   type="radio" name="gender" value="Other" > Other </label>

        </div>

        <small class="error-message" id="genderError"></small>
    </div>


    <!-- Course -->
    <div class="form-group">
        <label for="course">Course</label>

        <select id="course" name="course">
            <option value="">Select Course</option>
            <option value="Web Development">Web Development</option>
            <option value="UI/UX">UI/UX</option>
            <option value="java">java</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="MERN Stack">MERN Stack</option>
            <option value="Cloud Computing">Cloud Computing</option>
        </select>

        <small class="error-message" id="courseError"></small>
    </div>


    <!-- Skills -->
    <div class="form-group">
        <label>Skills</label>

        <div class="checkbox-group">

            <label> <input type="checkbox" name="skills"  value="HTML"> HTML </label>
            <label> <input type="checkbox" name="skills" value="CSS" >CSS </label>
            <label> <input  type="checkbox" name="skills"  value="JavaScript">JavaScript</label>
            <label> <input type="checkbox" name="skills" value="Git">Git</label>
            <label>  <input  type="checkbox"   name="skills"  value="React"> React</label>
            <label> <input type="checkbox"  name="skills" value="Node.js"> Node.js </label>

        </div>
        <small class="error-message" id="skillsError"></small>
    </div>


    <!-- About Student -->
    <div class="form-group full-width">
        <label for="aboutStudent">About Student</label>

        <textarea  id="aboutStudent" name="aboutStudent" maxlength="200"  placeholder="Tell us about the student." ></textarea>
        <div id="characterCount">0 / 200</div>
        <small class="error-message" id="aboutError"></small>
    </div>


    <!-- Profile Photo -->
    <div class="form-group full-width">
        <label for="profilePhoto">Profile Photo</label>

        <input  type="file"  id="profilePhoto"  name="profilePhoto" >
        <small class="error-message" id="photoError"></small>
    </div>


    <!-- Buttons -->
    <div class="form-buttons full-width">
        <button type="submit" id="submitButton">  Register Student </button>
        <button type="reset" id="resetButton">  Reset Form </button>
    </div>

</form>
        </section>


        <!-- Student Statistics -->
        <section id="statistics-section">
            <h2>Student Statistics</h2>
        </section>


       
        <section id="search-section">
            <h2>Search and Filter Students</h2>

            <input type="text" id="searchInput"  placeholder="Search student by name">

            <select id="courseFilter">
                <option value="all">All Courses</option>
            </select>
        </section>


        <!-- Student Cards -->
        <section id="students-section">
            <h2>Student Applications</h2>

            <div id="studentContainer"></div>
        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p> Student Application Management System</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
