<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Application Management System</title>
</head>

<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>

    <main>
        <h2>Student Registration</h2>
        <section class="registration-section">
            <form class="student-registration" id="studentForm" method="post">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" name="name" id="name" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" name="phone" id="phone" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" name="dob" id="dob" required>
                </div>
                <br>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">

                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>

                        <input type="radio" id="other" name="gender" value="Other">
                        <label for="other">Other</label>

                    </div>
                </div>
                <br>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select name="course" id="course">

                        <option value="">Select Course</option>
                        <option value="Web Development">
                            Web Development
                        </option>
                        <option value="UI/UX">
                            UI/UX
                        </option>
                        <option value="Python">
                            Python
                        </option>
                        <option value="Data Analytics">
                            Data Analytics
                        </option>
                        <option value="MERN Stack">
                            MERN Stack
                        </option>
                        <option value="Cloud Computing">
                            Cloud Computing
                        </option>

                    </select>
                </div>
                <br>

                <div class="form-group full-width">

                    <label>Skills</label>

                    <div class="checkbox-group">

                        <input type="checkbox" id="html" name="skills" value="HTML">
                        <label for="html">HTML</label>


                        <input type="checkbox" id="css" name="skills" value="CSS">
                        <label for="css">CSS</label>


                        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                        <label for="javascript">JavaScript</label>


                        <input type="checkbox" id="git" name="skills" value="Git">
                        <label for="git">Git</label>


                        <input type="checkbox" id="react" name="skills" value="React">
                        <label for="react">React</label>


                        <input type="checkbox" id="node" name="skills" value="Node.js">
                        <label for="node">Node.js</label>

                    </div>

                </div>

                <div class="form-group full-width">

                    <label for="about">
                        About Student
                    </label>

                    <textarea id="about" name="about" maxlength="200"
                        placeholder="Write something about the student..."></textarea>

                    <p id="characterCount">
                        0 / 200
                    </p>

                </div>
                <br>

                <div class="form-group full-width">

                    <label for="photo">
                        Profile Photo
                    </label>

                    <input type="file" id="photo" name="photo" accept="image/*">

                </div>
                <br>

                <div class="form-buttons full-width">

                    <button type="submit" id="registerBtn">
                        Register Student
                    </button>

                    <button type="reset" id="resetBtn">
                        Reset Form
                    </button>

                </div>

            </form>

        </section>

        <section class="student-statistics">

            <h2>Student Statistics</h2>

            <div class="statistics-container">

                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div class="stat-card">
                    <h3>Web Development</h3>
                    <p id="webDevelopmentCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>UI/UX</h3>
                    <p id="uiuxCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Python</h3>
                    <p id="pythonCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Data Analytics</h3>
                    <p id="dataAnalyticsCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>MERN Stack</h3>
                    <p id="mernStackCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Cloud Computing</h3>
                    <p id="cloudComputingCount">0</p>
                </div>

            </div>

        </section>


        <section class="search-filter">

            <input type="text" id="searchInput" placeholder="Search student by name...">

            <select id="courseFilter">

                <option value="All">
                    All Courses
                </option>

                <option value="Web Development">
                    Web Development
                </option>

                <option value="UI/UX">
                    UI/UX
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="Data Analytics">
                    Data Analytics
                </option>

                <option value="MERN Stack">
                    MERN Stack
                </option>

                <option value="Cloud Computing">
                    Cloud Computing
                </option>

            </select>

        </section>

        <section class="student-card-container" id="studentContainer">
        </section>

    </main>

    <footer>
        <p>Student Application Management System</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
