<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Application Management System</h1>
    <p>Register and manage student applications</p>
</header>

<main>
    <section>
        <h2>Student Registration Form</h2>
        <form id="studentForm" class="registration-form">

            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Course:</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>Web Development</option>
                    <option>UI/UX</option>
                    <option>Python</option>
                    <option>Data Analytics</option>
                    <option>MERN Stack</option>
                    <option>Cloud Computing</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Skills:</label>
                <div class="skills-group">
                    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="Git"> Git</label>
                    <label><input type="checkbox" name="skills" value="React"> React</label>
                    <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="about">About Student:</label>
                <textarea id="about" maxlength="200" rows="5" placeholder="Tell us about the student..."></textarea>
                <small>Maximum 200 characters</small>
            </div>

            <div class="form-group full-width">
                <label for="profilePhoto">Profile Photo:</label>
                <input type="file" id="profilePhoto" accept="image/*">
            </div>

            <div class="button-group full-width">
                <button type="submit">Register Student</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>
    </section>

    <section>
        <h2>Student Statistics</h2>
        <div class="statistics" id="statistics"></div>
    </section>

    <section>
        <h2>Search and Filter</h2>
        <form class="search-form">
            <div class="search-group">
                <label for="search">Search Student:</label>
                <input type="search" id="search" placeholder="Search by name or email">
            </div>
            <div class="search-group">
                <label for="filter">Filter by Course:</label>
                <select id="filter">
                    <option value="">All Courses</option>
                    <option>Web Development</option>
                    <option>UI/UX</option>
                    <option>Python</option>
                    <option>Data Analytics</option>
                    <option>MERN Stack</option>
                    <option>Cloud Computing</option>
                </select>
            </div>
        </form>
    </section>

    <section>
        <h2>Students</h2>
        <div class="student-cards" id="studentCards"></div>
        <p id="noStudents" class="no-students">No students registered yet.</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Student Application Management System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
