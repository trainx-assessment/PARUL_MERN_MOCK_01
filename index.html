<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="/submit" method="post">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" name="studentName" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label for="phoneNumber">Phone Number:</label>
        <input type="text" id="phoneNumber" name="phoneNumber" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label>Gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <br>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label for="course">Course:</label>
        <br>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="web-development">Web Development</option>
            <option value="ui-ux">UI/UX</option>
            <option value="python">Python</option>
            <option value="data-analytics">Data Analytics</option>
            <option value="mern-stack">MERN Stack</option>
            <option value="cloud-computing">Cloud Computing</option>
        </select>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label>Skills:</label>
        <br>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <br>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <br>
        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>
        <br>
        <input type="checkbox" id="git" name="skills" value="git">
        <label for="git">Git</label>
        <br>
        <input type="checkbox" id="react" name="skills" value="react">
        <label for="react">React</label>
        <br>
        <input type="checkbox" id="nodejs" name="skills" value="nodejs">
        <label for="nodejs">Node.js</label>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post">
        <label for="aboutStudent">About Student:</label>
        <br>
        <textarea id="aboutStudent" name="aboutStudent" maxlength="200" required></textarea>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form action="/submit" method="post" enctype="multipart/form-data">
        <label for="profilePhoto">Profile Photo:</label>
        <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
    <form>
        <input type="reset" value="Reset Form">
    </form>
</body>
</html>
