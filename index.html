<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charSet="UTF-8">
        <meta name ="viewport" content="width=device-width,init"
        <title> Student Management system </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Student Application Management System</h1>
            <h2>Register and manage student applications</h2>
        </header>
        <main>
            <form>
                <div clas="details">
                    <div>
                <label for = "stdname">Enter Name:</label>
                <input type = "text" name="stdname"><br>
                </div>

                <div>
                     <label for = "stdmail">Enter Email:</label>
                     <input type = "Email" name = "stdEmail"><br>
                </div>
                <div> 
                     <label for = "phone number"> Enter phone:</label>
                     <input type = "phone" name = "phone number"><br>
                </div>
                <div>    
                     <label for = "date of birth"> Enter date of birth:</label>
                     <input type = "date of birth" name = "date of birth"><br>
                </div>
                 
                <div>
                    <label for = "Gender"> Enter Gender:</label>
                    <input input = "Gender" name ="Gender"><br>
                </div>
                <div>
                    <input type = "radio" name="Gender">Male</>
                    <input type = "radio" name="Gender">female</>
                    <input type = "radio" name="Gender">other</>

                </div>
                <div>
                  <select name="course" id="course">
                    <option value="0" selected disabled>select course</option>
                    <option value="1" Web Development>Web Development</option>
                    <option value="2" UI/UX>UI/UX</option>
                    <option value="3" Python>Python</option>
                    <option value="4" Data Analytics>Data Analytics</option>
                    <option value="5" MERN Stack>MERN Stack</option>
                    <option value="6" Cloud Computing>Cloud Computing</option>
                    </select>
                </div>
                </form>
                </main>
                <label for="skills">skills:</label><br>
                <input type="checkbox" name="skills" value="HTML">HTML</input>
                <input type="checkbox" name="skills" value="CSS">CSS</input>
                <input type="checkbox" name="skills" value="JavaScript">JavaScript</input>
                <input type="checkbox" name="skills" value="Git">Git</input>
                <input type="checkbox" name="skills" value="React">React</input>
                <input type="checkbox" name="skills" value="Node.js">Node.js</input>
                </body><div>
                    <label for="about">About:</label>
                    <textarea name="about" id="about"> </textarea><br>
                    <input type="file" accept="" class="fileinput">
                    <div class="btns">
                        <button type="submit">Register student</button>
                        <button type="reset"> reset form</button>
                    </div>
                </div>
                
            </form>
            <section>
                <div class="cards"
            </section>
            </form>
        </main>
        <footer>
            <p> mayank copyright@2026</p>
        </footer>
    </body>
</html>
