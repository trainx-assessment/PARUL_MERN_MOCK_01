<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student application management system</h1>
        <p>Register and manage student applications</p>
        <button id="darkModeBtn">Dark Mode</button>
    </header>
    <main>
        <section class="registrationSection">
            <form id="studentForm">
                <div class="formGrid">
                    <div class="inputGroup">
                        <label for="name">Student Name</label>
                        <input type="text" id="name">
                        <span class="errorText" id="nameError"></span>
                    </div>
                    <div class="inputGroup">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                        <span class="errorText" id="emailError"></span>
                    </div>
                    <div class="inputGroup">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone">
                        <span class="errorText" id="phoneError"></span>
                    </div>
                    <div class="inputGroup">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                        <span class="errorText" id="dobError"></span>
                    </div>
                    <div class="inputGroup">
                        <label>Gender</label>
                        <div class="radioGroup">
                            <input type="radio" name="gender" value="Male" checked> Male
                            <input type="radio" name="gender" value="Female"> Female
                            <input type="radio" name="gender" value="Other"> Other
                        </div>
                        <span class="errorText" id="genderError"></span>
                    </div>
                    <div class="inputGroup">
                        <label for="course">Course</label>
                        <select id="course">
                            <option value="Select Course" disabled  selected>Select Course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Python">Python</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="MERN Stack">MERN Stack</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                        </select>
                        <span class="errorText" id="courseError"></span>
                    </div>
                    <div class="inputGroup">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" accept=".jpg,.jpeg,.png">
                        <span class="errorText" id="photoError"></span>
                    </div>
                </div>

                <div class="fullWidth">
                    <label>Skills</label>
                    <div class="checkboxGroup">
                        <input type="checkbox" value="HTML" class="skillCheckbox"> HTML
                        <input type="checkbox" value="CSS" class="skillCheckbox"> CSS
                        <input type="checkbox" value="JavaScript" class="skillCheckbox"> JavaScript
                        <input type="checkbox" value="Git" class="skillCheckbox"> Git
                        <input type="checkbox" value="React" class="skillCheckbox"> React
                        <input type="checkbox" value="Node.js" class="skillCheckbox"> Node.js
                    </div>
                    <span class="errorText" id="skillsError"></span>
                </div>

                <div class="fullWidth">
                    <label for="about">About Student <span id="characterCount">0 / 200</span></label>
                    <textarea id="about" rows="3"></textarea>
                    <span class="errorText" id="aboutError"></span>
                </div>

                <div class="fullWidth formButtons">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="reset" id="resetBtn">Reset Form</button>
                </div>
            </form>
        </section>
        <section class="searchFilterSection">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <select id="filterCourse">
                <option value="All Courses" disabled selected>All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </section>

        <section class="statisticsSection">
            <h3 id="totalStudents">Total Students: 0</h3>
            <div id="courseStats"></div>
        </section>

        <section class="cardsContainer" id="cardsContainer"></section>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
