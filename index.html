<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>
            <button id="themeToggleBtn" type="button">Dark Mode</button>
        </div>
    </header>

    <main>

        <section class="registration">
            <h2>Student Registration</h2>

            <form id="form" novalidate>

                <div class="form-group">
                    <label for="name">Student Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter student name">
                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter email">
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" placeholder="Enter 10 digit phone number" maxlength="10">
                    <small class="error" id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label for="date-of-birth">Date of Birth:</label>
                    <input type="date" id="date-of-birth" name="date-of-birth">
                    <small class="error" id="dobError"></small>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="gender-options">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <small class="error" id="genderError"></small>
                </div>

                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                    <small class="error" id="courseError"></small>
                </div>

                <div class="form-group">
                    <label>Skills:</label>
                    <div class="skills-options">
                        <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                        <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="Git"> Git</label>
                        <label><input type="checkbox" name="skills" value="React"> React</label>
                        <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
                    </div>
                    <small class="error" id="skillsError"></small>
                </div>

                <div class="form-group">
                    <label for="about">About Student:</label>
                    <textarea id="about" name="about" rows="5" placeholder="Write about yourself..." maxlength="200"></textarea>
                    <div class="character-counter">
                        <span id="charCount">0</span> / 200
                    </div>
                    <small class="error" id="aboutError"></small>
                </div>

                <div class="form-group">
                    <label for="profile-photo">Profile Photo:</label>
                    <input type="file" id="profile-photo" name="profile-photo" accept=".jpg,.jpeg,.png">
                    <small class="error" id="photoError"></small>
                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">Register Student</button>
                    <button type="reset" id="resetBtn">Reset Form</button>
                </div>

            </form>
        </section>

        <section class="display" id="total_count">
            <h2>Student Statistics</h2>
            <h3 class="total_count">Total Students: <span id="totalStudentsCount">0</span></h3>
            <div id="courseStats" class="course-stats"></div>
        </section>

        <section class="students-section">
            <h2>Registered Students</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search student by name...">
            </div>

            <div class="filter-box" style="margin-bottom: 15px;">
                <label for="filterCourse">Filter by Course:</label>
                <select id="filterCourse">
                    <option value="All Courses">All Courses</option>
                    <option value="Web Development">Web Development</option>
                    <option value="UI/UX">UI/UX</option>
                    <option value="Python">Python</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                </select>
            </div>

            <div class="student-cards" id="student-cards"></div>
        </section>

    </main>

    <footer></footer>

    <script src="script.js"></script>

</body>

</html>
