<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <section class="s1">
        <h2>Student Registration Form</h2>
        <form action="">

                <label for="studentName">Student Name</label>
                <input  type="text" id="studentName" name="studentName" required >
                
                <label for="email">Email</label>
                <input  type="email" id="email" name="email" required >

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required >

                <label for="dob">Date of Birth</label>
                <input type = "date" id="dob" name="dob" required >

         </form>

          
               <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="Web Development">Web Development</option>
                    <option value="UI/UX">UI/UX</option>
                    <option value="Python">Python</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                </select>

                 <legend>Gender</legend>
                 <div class="gender">
                  
                    <label>
                        <input type="radio" name="gender" value="Male" required> Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other"> Other
                    </label>
                 </div> 
 
         
                    <legend>Skills</legend>
             <div class="skills">
                    <label>
                        <input type="checkbox" name="skills" value="HTML">HTML
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="CSS" >CSS
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="Git"> Git
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="React"> React
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="Node.js"> Node.js
                    </label>
                </div>

                <label class="about-student" for="aboutStudent">About Student</label>
                <textarea
                    id="aboutStudent"
                    name="aboutStudent"
                    maxlength="200"
                    placeholder="Maximum 200 characters"
                ></textarea>

                <small id="characterCount">0 / 200</small>

               <div class="register-btn">
                 <button type="submit" id="submitButton">Register Student</button>
                <button type="reset">Reset Form</button>
               </div>
            
        </section>


        <section class="s2">
        <h2>Student statistics</h2>
        </section>

        <section class="s3">
         <h2>Search and Filter section</h2>
        </section>
    </main>
     
         
    <script src="script.js"></script>
</body>
</html>
