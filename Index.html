<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <section class="Student_form">
            <h2>Student Registration</h2>
    <form id="studentForm">
        <div class="Form_Structure">
            <div class="Cat">
                <label for="Student_name">Student Name</label>
                <input type="text" id="studentname" placeholder="Enter name">
            </div>
            <div class="Cat">
                <label for="Student_email">Student Email</label>
                <input type="email" id="studentemail" placeholder="Enter email">
            </div>
            <div class="Cat">
                <label for="Student_Phone">Student Phone</label>
                <input type="text" id="studentphone" placeholder="Enter phone number">
            </div>

        <div class="Cat">
                <label for="Student_DOB">Student DOB</label>
                <input type="date" id="DOB">
            </div>
        <div class="Cat">
                <label>Gender</label>
                <div class="Student_Gender">
                    <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                    </label>
                    <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                    </label>
                    <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                    </label>
                </div>
                </div>
                <div class="Cat">
                    <select id="course">
                       <option value="">Select Course</option> 
                       <option value="Web Development">Web Development</option>
                       <option value="UI/UX">UI/UX</option>
                       <option value="Python">Python</option>
                       <option value="Data Analytics">Data Analytics</option>\
                       <option value="Mern Stack">Mern Stack</option>
                       <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                </div>
                <div class="Cat">
                    <label>Skills</label>
                    <div class="Students_Skills">
                        <label>
                            <input type="checkbox" name="skills" value="HTML">
                            HTML
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="CSS">
                            CSS
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="JavaScript">
                            JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="Git">
                            Git
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="React">
                            React
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="Node.js">
                            Node.js
                        </label>
                    </div>
                </div>
                <div class="Student_About">
                    <label for="About">About Student</label>
                    <textarea id="about" maxlength="200" placeholder="Write About Yourself"></textarea>
                </div>
                <div class="Student_About">
                    <label for="Portfolio"></label>
                    <input type="file" id="photo">
                </div>
                <div class="Buttons_Section">
                    <button type="submit" id="submitbtn">
                        Register Student
                    </button>
                    <button type="button" id="rst">
                        Reset Form
                    </button>
                </div>
        </div>
    </form>
    </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
