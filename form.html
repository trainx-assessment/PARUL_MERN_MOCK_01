<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Management System</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>Student Application Management System</h1>
            <p>Register and manage student applications</p>

          
        </div>
    </header>


    <main class="container">

        <section class="form-section">

            <h2>Student Registration</h2>

            <form id="studentForm" novalidate>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="studentName">Student Name</label>

                        <input
                            type="text"
                            id="studentName"
                            name="studentName"
                            placeholder="Enter student name"
                            maxlength="40"
                        >

                        <small class="error-message" id="studentNameError"></small>
                    </div>


                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email"
                        >

                        <small class="error-message" id="emailError"></small>
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10-digit phone number"
                            maxlength="10"
                        >

                        <small class="error-message" id="phoneError"></small>
                    </div>


                    <div class="form-group">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                        >

                        <small class="error-message" id="dobError"></small>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <div class="radio-group">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                >
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                >
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                >
                                Other
                            </label>

                        </div>

                        <small class="error-message" id="genderError"></small>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>

                        <select id="course" name="course">

                            <option value="">Select Course</option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="UI/UX">
                                UI/UX
                            </option>

                            <option value="Python">
                                Python
                            </option>

                            <option value="Data Analytics">
                                Data Analytics
                            </option>

                            <option value="MERN Stack">
                                MERN Stack
                            </option>

                            <option value="Cloud Computing">
                                Cloud Computing
                            </option>

                        </select>

                        <small class="error-message" id="courseError"></small>
                    </div>

                        <label>Skills</label>

                        <div class="checkbox-group">

                            <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="HTML"
                                >
                                HTML
                            </label>
                             <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="CSS"
                                >
                                CSS
                            </label>
                             <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="JAVASCRIPT"
                                >
                                JAVASCRIPT
                            </label>
                             <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="REACT"
                                >
                                REACT
                            </label>
                             <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="NODE.JS"
                                >
                                NODE.JS
                            </label>
                             <label>
                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="GIT"
                                >
                                GIT
                            </label>

                            

                        </div>
                        <footer>
                           <button>
                            SUBMIT
                           </button>
                        </footer>

                      
    <script src="script.js"></script>

</body>
</html>
