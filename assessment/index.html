<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Application Management System</title>
</head>
<body>
    <header>
        <h1>Student Application Management System</h1>
        <p>Register and manage student applications</p>
    </header>
    <main>
        <section class="registration-section">
            <div id="error-messages" style="color: red; font-weight: bold; margin-bottom: 15px; text-align: center;"></div>
            <form id="student-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" name="studentName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender</label>
                        <div class="radio-group">
                            <input type="radio" id="male" name="gender" value="Male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="Female">
                            <label for="female">Female</label>
                            <input type="radio" id="other" name="gender" value="Other">
                            <label for="other">Other</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course">
                            <option value="">Select Course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Python">Python</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="MERN Stack">MERN Stack</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Skills</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="skill-html" name="skills" value="HTML">
                        <label for="skill-html">HTML</label>
                        <input type="checkbox" id="skill-css" name="skills" value="CSS">
                        <label for="skill-css">CSS</label>
                        <input type="checkbox" id="skill-js" name="skills" value="JavaScript">
                        <label for="skill-js">JavaScript</label>
                        <input type="checkbox" id="skill-git" name="skills" value="Git">
                        <label for="skill-git">Git</label>
                        <input type="checkbox" id="skill-react" name="skills" value="React">
                        <label for="skill-react">React</label>
                        <input type="checkbox" id="skill-node" name="skills" value="Node.js">
                        <label for="skill-node">Node.js</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="about">About Student <span id="char-count" style="font-weight: normal; float: right; color: #581c87;">0 / 200</span></label>
                    <textarea id="about" name="about" maxlength="200" placeholder="Maximum 200 characters"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="photo">Profile Photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </div>

                <div class="form-actions">
                    <button type="submit">Register Student</button>
                    <button type="reset">Reset Form</button>
                </div>
            </form>
        </section>

        <section class="statistics-section">
            <h2>Student Statistics</h2>
            <p id="stat-total" style="font-weight: bold;">Total Students: 0</p>
            <p id="stat-web">Web Development: 0</p>
            <p id="stat-ui">UI/UX: 0</p>
            <p id="stat-python">Python: 0</p>
            <p id="stat-data">Data Analytics: 0</p>
            <p id="stat-mern">MERN Stack: 0</p>
            <p id="stat-cloud">Cloud Computing: 0</p>
        </section>

        <section class="search-filter-section">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <select id="courseFilter">
                <option value="All Courses">All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </section>

        <section class="student-cards-container">
        </section>
    </main>
    <footer>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
