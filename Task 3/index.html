    <h1>Registration Form</h1>
    <section>
        <div class="card1">

            <label for="name" id="name">Student Name</label>
            <input type="text" name="name"><br>
            <label for="email" id="email">Email</label>
            <input type="email" name="email" required><br>
            <label for="number" id="number">Phone Number</label>
            <input type="text" name="number" required><br>
            <label for="dob" id="dob">Date of Birth</label>
            <input type="date" name="dob" required><br>
            <label for="gender" id="gender">Gender</label>
            <input type="checkbox" name="gender" value="male" required> Male
            <input type="checkbox" name="gender" value="female" required> Female<br>
            <label for="course" id="course">Course:</label>
            <input type="text" name="course" required>
        </form>
    </div><br><br>
