<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="mains">

        <div class="text">
            <h1>Student Application Management System</h1>
        </div>

        <div class="text">
            <p>Register and manage student applications</p>
        </div>

    </header>


    <main class="container">

        <section class="details">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <div class="data">

                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name">
                    <small id="studentNameError"></small>

                </div>
                <div class="data">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter student email">
                    <small id="emailError"></small>
                </div>

                <div class="data">
                    <label for="phone"> Mobile Number</label>
                    <input type="text" id="phone" placeholder="Enter 10 digit mobile number">\
                    <small id="phoneError"></small>
                </div>
                <div class="data">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                    <small id="dobError"></small>
                </div>
                <div class="data">
                    <label>Gender</label>
                    <label><input type="radio" name="gender" value="Male">Male</label>
                    <label><input type="radio" name="gender" value="Female">Female</label>
                    <label><input type="radio" name="gender" value="Other">Other</label>
                    <small id="genderError"></small>

                </div>

                <div class="data">
                    <label for="course">Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX">UI/UX</option>
                        <option value="Python">Python</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="MERN Stack">MERN Stack</option>
                        <option value="Cloud Computing">Cloud Computing</option>
                    </select>
                    <small id="courseError"></small>

                </div>
                <div class="data">

                    <label>Skills</label>
                    <label><input type="checkbox" name="skills" value="HTML">HTML</label>

                    <label>
                        <input type="checkbox" name="skills" value="CSS">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="JavaScript">
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Git">
                        Git
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="React">
                        React
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Node.js">
                        Node.js
                    </label>

                    <small id="skillsError"></small>

                </div>


                <!-- About Student -->
                <div class="data">

                    <label for="about">
                        About Student
                    </label>

                    <textarea id="about" maxlength="200" placeholder="Write about the student..."></textarea>

                    <p id="characterCounter">
                        0 / 200
                    </p>

                    <small id="aboutError"></small>

                </div>
                <div class="data">

                    <label for="photo"> Profile Photo</label>

                    <input type="file" id="photo" accept=".jpg,.jpeg,.png">

                    <small id="photoError"></small>

                </div>

                <div class="button">
                    <button type="submit" id="submitButton">Register Student</button>
                    <button type="button" id="resetButton">Reset Form</button>
                </div>
            </form>
        </section>

        <section class="statistics">
            <h2>Student Statistics</h2>
            <p>
                Total Students:
                <span id="totalStudents">0</span>
            </p>

        </section>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <select id="courseFilter">
                
                <option value=""> All Courses</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Cloud Computing">Cloud Computing</option>

            </select>

        </section>
        <section>
            <div id="studentContainer" class="student-container"></div>
        </section>
    </main>
    <footer>
        <p>Student Application Management System</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
```
